<!doctype html>
<html lang="ko">
<head>
<script>try{if(sessionStorage.getItem('elium_auth_ok')!=='1'){location.replace('/maps/');}}catch(e){}</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>현장 3D 콘타모형</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
<style>
  :root{ --ink:#1c2433; --ink-soft:#5b6272; --panel:#fbfaf7; --line:#d4d0c6; --navy:#1b2f5c; --table:#d9d6cf; }
  html,body{margin:0;height:100%;background:var(--table);font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0}
  .panel{position:absolute;left:16px;top:16px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .panel h1{margin:0;font-size:18px;letter-spacing:-.3px}
  .panel p{margin:6px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
  .panel ul{list-style:none;margin:10px 0 0;padding:0}
  .panel li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px}
  .panel li:hover{background:#eef0f5}
  .panel li i{width:9px;height:9px;border-radius:50%;background:var(--navy);flex:none}
  .panel li.ref i{background:#9aa0ad}
  .panel li span{color:var(--ink-soft);font-size:12px;margin-left:auto}
  .island{cursor:pointer;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;transition:transform .18s ease}
  .island:hover{transform:scale(1.05)}
  .island img{width:var(--w,170px);height:auto;display:block;filter:drop-shadow(0 10px 12px rgba(40,34,20,.28))}
  .cap{order:-1;margin-bottom:4px;background:var(--navy);color:#fff;border-radius:8px;padding:5px 10px 6px;text-align:center;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .cap b{display:block;font-size:13.5px}
  .cap small{font-size:11px;color:#cdd6ea}
  .island.ref .cap{background:#fbfaf6;color:var(--ink);border:1px solid #cfc8b8}
  .island.ref .cap small{color:#6b665c}
  .note{position:absolute;right:14px;bottom:30px;z-index:5;font-size:11.5px;color:#6b665c;background:rgba(251,250,247,.85);padding:6px 10px;border-radius:8px;line-height:1.5;text-align:right}
  @media (max-width:640px){ .panel{max-width:none;right:16px} .island img{width:120px} .note{display:none} }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>현장 3D 콘타모형</h1>
  <p>섬을 누르면 해당 현장의 콘타모형(국토지리정보원 1:5,000 연속수치지형도)으로 들어갑니다.</p>
  <ul id="list"></ul>
</div>
<div class="note">섬 크기는 강조해서 표시 · 실제 반경 약 2~4 km</div>
<script>
// ===== 설정 =====
mapboxgl.accessToken = "pk.eyJ1Ijoic3kyc3kiLCJhIjoiY211ZGVidW9rMmFrYTJ4cG1hZ3A4cmhuaiJ9.6_gsdFct9YRg5zAmjidgqg";
const SITES = [
  { id:'gy', name:'인천계양 A21', sub:'대방 엘리움 · 비교단지 20곳', own:true,  site:[126.75265,37.54733], island:[124.75,36.85], img:'island_gy.png', href:'gy/index.html' },
  { id:'bs', name:'부산에코델타시티 2차', sub:'대방 엘리움(29BL) · 비교단지 14곳', own:true, site:[128.922713,35.146939], island:[128.25,33.95], img:'island_bs.png', href:'bs/index.html' },
  { id:'il', name:'일광신도시', sub:'비교단지 10곳 (부산 참고)', own:false, site:[129.2240,35.2652], island:[130.45,35.55], img:'island_il.png', href:'il/index.html' },
];
const HOME = { center:[127.55,36.05], zoom:6.05, pitch:46, bearing:-6 };
// =================

const map = new mapboxgl.Map({ container:'map', style:'mapbox://styles/mapbox/light-v11', ...HOME, antialias:true, attributionControl:true, language:'ko' });
map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}),'bottom-right');

map.on('style.load', () => {
  // 모형 톤으로 색 조정(베이지 땅 · 옅은 청회색 바다)
  const L = map.getStyle().layers;
  for (const l of L) {
    const id = l.id;
    if (l.type==='background') map.setPaintProperty(id,'background-color','#ece7dc');
    if (/^land|landcover|landuse|national-park/.test(id) && l.type==='fill') { try{ map.setPaintProperty(id,'fill-color','#e7e1d3'); map.setPaintProperty(id,'fill-opacity',0.5);}catch(e){} }
    if (/^water$/.test(id)) map.setPaintProperty(id,'fill-color','#d5dfe3');
    if (/road|bridge|tunnel|path|rail|aeroway|building|poi|transit|airport/.test(id)) map.setLayoutProperty(id,'visibility','none');
    if (l.type==='symbol' && !/country-label|state-label|settlement-major-label|continent/.test(id)) map.setLayoutProperty(id,'visibility','none');
    if (/admin-0-boundary$/.test(id)) { try{ map.setPaintProperty(id,'line-color','#b9b09c'); }catch(e){} }
  }
  // 3D 지형 + 음영
  map.addSource('dem',{type:'raster-dem',url:'mapbox://mapbox.mapbox-terrain-dem-v1',tileSize:512,maxzoom:14});
  map.setTerrain({source:'dem',exaggeration:2.4});
  map.addLayer({id:'shade',type:'hillshade',source:'dem',paint:{'hillshade-shadow-color':'#8d8068','hillshade-highlight-color':'#fbf8f1','hillshade-accent-color':'#a79a80','hillshade-exaggeration':0.55}}, L.find(l=>l.type==='symbol')?.id);
  map.setFog({color:'#e9e5dc','high-color':'#dcd8cf','horizon-blend':0.08,'space-color':'#d9d6cf','star-intensity':0});

  // 한반도 밖은 옅게 덮어서 한반도만 또렷하게
  map.addSource('mask',{type:'geojson',data:'korea_mask.geojson'});
  map.addLayer({id:'mask',type:'fill',source:'mask',paint:{'fill-color':'#dcd8cf','fill-opacity':0.78}});
  // 현장 점 + 섬 연결선
  map.addSource('links',{type:'geojson',data:{type:'FeatureCollection',features:SITES.map(s=>({type:'Feature',properties:{own:s.own},geometry:{type:'LineString',coordinates:[s.site,s.island]}}))}});
  map.addLayer({id:'links',type:'line',source:'links',paint:{'line-color':'#1b2f5c','line-width':1.6,'line-opacity':0.55,'line-dasharray':[2,1.5]}});
  map.addSource('sites',{type:'geojson',data:{type:'FeatureCollection',features:SITES.map(s=>({type:'Feature',properties:{own:s.own},geometry:{type:'Point',coordinates:s.site}}))}});
  map.addLayer({id:'site-halo',type:'circle',source:'sites',paint:{'circle-radius':9,'circle-color':'#1b2f5c','circle-opacity':0.18}});
  map.addLayer({id:'site-dot',type:'circle',source:'sites',paint:{'circle-radius':4,'circle-color':['case',['get','own'],'#1b2f5c','#8a8272'],'circle-stroke-color':'#fff','circle-stroke-width':1.5}});
});

// 섬 마커
const list = document.getElementById('list');
for (const s of SITES) {
  const el = document.createElement('div'); el.className='island'+(s.own?'':' ref');
  el.innerHTML = `<img src="${s.img}" alt="${s.name} 콘타모형 섬"><div class="cap"><b>${s.name}</b><small>${s.sub}</small></div>`;
  el.addEventListener('click', ()=>enter(s));
  new mapboxgl.Marker({element:el, anchor:'bottom'}).setLngLat(s.island).addTo(map);
  const li=document.createElement('li'); if(!s.own) li.className='ref';
  li.innerHTML=`<i></i>${s.name}<span>들어가기 →</span>`; li.onclick=()=>enter(s); list.appendChild(li);
}
function sizeIslands(){ const z=map.getZoom(); const w=Math.max(110,Math.min(260,110+(z-5)*70)); document.documentElement.style.setProperty('--w',w+'px'); }
map.on('zoom',sizeIslands); sizeIslands();

// 섬 클릭 → 현장으로 날아간 뒤 콘타모형 페이지로
let busy=false;
function enter(s){
  if(busy) return; busy=true;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ location.href=s.href; return; }
  map.flyTo({center:s.site, zoom:12.3, pitch:60, bearing:-20, duration:1800, essential:true});
  map.once('moveend', ()=>{ location.href=s.href; });
}
</script>
</body>
</html>
