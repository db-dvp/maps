// 붙박이장·팬트리 (수납류 방을 기본옵션 수납으로 채움)
function cbx(x1,y1,x2,y2,h0,h1,mat,parent){const m=new THREE.Mesh(new THREE.BoxGeometry((x2-x1)*M,h1-h0,(y2-y1)*M),mat);m.castShadow=true;m.receiveShadow=true;m.position.set(X((x1+x2)/2),(h0+h1)/2,Z((y1+y2)/2));parent.add(m);return m;}
(PLAN.closets||[]).forEach(cn=>{
  const rm=PLAN.rooms.find(r=>r.name===cn); if(!rm) return;
  const xs=rm.pts.map(p=>p[0]),ys=rm.pts.map(p=>p[1]);
  const x1=Math.min(...xs),x2=Math.max(...xs),y1=Math.min(...ys),y2=Math.max(...ys);
  const base=cn.replace(/\(.*\)/,'');
  const ds=OPS.filter(p=>p.kind==='door'&&(p.pair||[]).some(n=>n.replace(/\(.*\)/,'')===base));
  const side={t:false,b:false,l:false,r:false};
  ds.forEach(p=>{ if(p.o==='h'){ if(Math.abs(p.c-y2)<Math.abs(p.c-y1)) side.b=true; else side.t=true; } else { if(Math.abs(p.c-x2)<Math.abs(p.c-x1)) side.r=true; else side.l=true; } });
  const clm=new THREE.MeshStandardMaterial({color:'#d9cdb4',roughness:.75}), seam=new THREE.MeshStandardMaterial({color:'#8c7f68',roughness:.8});
  const d=(base.includes('드레스')?0.6:0.45)/M, h=2.05, wallT=3;
  const blk=(a,b,c,e)=>{ if(c-a<2||e-b<2) return; const m=cbx(a,b,c,e,0,h,clm,kitG);
    const horiz=(c-a)>(e-b); const L=(horiz?c-a:e-b)*M, n=Math.max(1,Math.round(L/0.55));
    for(let i=1;i<n;i++){ const f=i/n; if(horiz) cbx(a+(c-a)*f-0.4,e-1.2,a+(c-a)*f+0.4,e+0.2,0.05,h-0.05,seam,kitG); else cbx(c-1.2,b+(e-b)*f-0.4,c+0.2,b+(e-b)*f+0.4,0.05,h-0.05,seam,kitG); }
    cbx(a,b,c,e,h,h+0.03,seam,kitG);
  };
  const xa=x1+wallT,xb=x2-wallT,ya=y1+wallT,yb=y2-wallT;
  if(!ds.length){ blk(xa,ya,xb,yb); return; }
  if(!side.t) blk(xa,ya,xb,ya+d);
  if(!side.b) blk(xa,yb-d,xb,yb);
  if(!side.l) blk(xa,ya+(side.t?0:d),xa+d,yb-(side.b?0:d));
  if(!side.r) blk(xb-d,ya+(side.t?0:d),xb,yb-(side.b?0:d));
});
