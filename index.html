<style>
  :root{
    --paper:#f5f1e9;
    --paper-raised:#ffffff;
    --ink:#202a5d;
    --ink-soft:#5c6790;
    --indigo:#202a5d;
    --indigo-deep:#141b40;
    --indigo-mid:#6478c8;
    --blush:#e5cedb;
    --blush-deep:#c17b9b;
    --gold:#d5a67d;
    --line:#e6ded1;
    --line-strong:#d3c7b2;
    --status-upcoming:#202a5d;
    --status-competitor:#7d5ba6;
    --age-under1:#e0a728;
    --age-1to5:#2f6fd6;
    --age-5to10:#12a39c;
    --age-over10:#c1443c;
    --age-presale:#7d5ba6;
    --status-scheduled:#c23b7a;
    --shadow:0 12px 32px -12px rgba(24,27,60,.28);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow-x:hidden;}
  body{
    font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
    color:var(--ink);
    background:var(--paper);
    display:flex;flex-direction:column;
  }
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:12px 20px;background:var(--paper-raised);
    border-bottom:1px solid var(--line);
    box-shadow:var(--shadow);position:relative;z-index:20;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo-wrap{
    background:#fff;border-radius:8px;padding:4px 8px;
    display:flex;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .brand-logo{height:20px;display:block;}
  .brand small{
    display:block;font-size:.62rem;letter-spacing:.08em;color:var(--ink-soft);
    font-weight:600;margin-top:1px;
  }
  .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .filter-btn{
    border:1px solid var(--line-strong);background:var(--paper-raised);
    color:var(--ink-soft);font-size:.78rem;font-weight:600;
    padding:6px 12px;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:.15s;
  }
  .filter-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .filter-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .setup-banner{
    background:#fff3cd;border-bottom:1px solid #e2c465;color:#5c4a12;
    font-size:.82rem;padding:10px 20px;display:none;line-height:1.5;
  }
  .setup-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;}
  .stage{position:relative;flex:1;min-height:0;}
  #appRoot{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;}
  #map{width:100%;height:100%;}
  .maptype-toggle{
    position:absolute;top:14px;left:14px;z-index:10;
    background:var(--paper-raised);border-radius:10px;box-shadow:var(--shadow);
    display:flex;overflow:hidden;border:1px solid var(--line);
  }
  .maptype-toggle button{
    border:none;background:transparent;padding:8px 12px;font-size:.78rem;
    font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .maptype-toggle button.active{background:var(--indigo);color:#fff;}
  .legend{
    position:absolute;left:14px;bottom:14px;z-index:10;
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);
    font-size:.78rem;min-width:150px;max-width:220px;
  }
  .legend-title{
    font-size:.68rem;font-weight:700;letter-spacing:.03em;color:var(--ink);
    margin:10px 0 6px;padding-top:8px;border-top:1px solid var(--line);
  }
  .age-filters{display:flex;flex-direction:column;gap:5px;min-width:150px;}
  .age-filters .filter-btn{
    font-size:.74rem;padding:6px 10px;gap:7px;width:100%;
    justify-content:flex-start;box-sizing:border-box;
  }
  .marker-pin{
    position:relative;width:22px;height:22px;cursor:pointer;
  }
  .marker-dot{
    position:absolute;left:0;top:0;
    width:22px;height:22px;border-radius:50%;
    border:3px solid #fff;
    box-shadow:0 0 0 1.5px rgba(0,0,0,.45),0 2px 7px rgba(0,0,0,.45);
  }
  .marker-label{
    position:absolute;left:27px;top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,.97);color:var(--ink);
    font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;
    box-shadow:0 1px 5px rgba(0,0,0,.25);white-space:nowrap;
  }
  .marker-pin-sm{width:17px;height:17px;}
  .marker-dot-sm{
    width:17px;height:17px;border-radius:50%;
    transform:none;border:2.5px solid #fff;
    box-shadow:0 0 0 1.75px rgba(0,0,0,.55),0 1.5px 6px rgba(0,0,0,.45);
  }
  .marker-label-sm{
    left:22px;font-size:11px;font-weight:700;padding:2px 7px;
    background:rgba(255,255,255,.96);color:var(--ink-soft);
    box-shadow:0 1px 4px rgba(0,0,0,.2);
    transform:translateY(-50%);
  }
  .marker-pin-brand{width:30px;height:30px;}
  .marker-dot-brand{
    position:absolute;left:0;top:0;
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:#fff;border:2.5px solid var(--status-upcoming);
    box-shadow:0 0 0 1.5px rgba(0,0,0,.4),0 3px 9px rgba(0,0,0,.5);
  }
  .marker-dot-brand img{
    display:block;width:19px;height:19px;pointer-events:none;
  }
  .marker-label-brand{
    left:35px;font-size:12px;font-weight:800;
    background:rgba(255,255,255,.98);color:var(--ink);
    padding:3px 9px;box-shadow:0 1px 6px rgba(0,0,0,.28);
  }
  .panel{
    position:absolute;top:0;right:0;bottom:0;width:460px;max-width:94vw;
    background:var(--paper-raised);box-shadow:-8px 0 24px -12px rgba(0,0,0,.25);
    z-index:15;transform:translateX(100%);transition:transform .25s ease;
    overflow-y:auto;
    font-size:13px;
  }
  .panel.open{transform:translateX(0);}
  .panel-inner{padding:20px 24px 28px;}
  .panel-close{
    position:absolute;top:14px;right:14px;border:none;background:var(--paper);
    width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--ink-soft);
  }
  .status-badge{
    display:inline-block;font-size:.68rem;font-weight:700;padding:3px 9px;
    border-radius:999px;color:#fff;margin-bottom:8px;letter-spacing:.01em;
  }
  .classification-badge{
    display:inline-block;font-size:.68rem;font-weight:700;padding:3px 9px;
    border-radius:999px;color:#fff;margin-bottom:8px;margin-left:6px;letter-spacing:.01em;
  }
  .panel h2{font-size:1.05rem;margin:0 0 3px;line-height:1.35;font-weight:800;}
  .panel .sub{color:var(--ink-soft);font-size:.76rem;margin-bottom:14px;}
  .section-label{
    font-size:.68rem;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;
    margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:space-between;
  }
  .stat-grid{
    display:flex;flex-direction:column;
    border-top:1px solid var(--line);margin-bottom:16px;
  }
  .stat-cell{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:7px 1px;border-bottom:1px solid var(--line);background:none;
  }
  .stat-cell .k{font-size:.72rem;color:var(--ink-soft);margin-bottom:0;flex:0 0 auto;}
  .stat-cell .v{font-size:.78rem;font-weight:700;text-align:right;line-height:1.45;}
  .addr-box{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:.76rem;margin-bottom:10px;line-height:1.5;}
  .addr-box .k{font-size:.64rem;color:var(--ink-soft);font-weight:700;margin-bottom:2px;letter-spacing:.02em;}
  .preview-banner{
    background:var(--gold);color:#fff;font-size:.7rem;font-weight:700;
    padding:6px 10px;border-radius:8px;margin-bottom:12px;
  }
  .note{font-size:.72rem;color:var(--ink-soft);line-height:1.6;}
  .proxy-tag{
    display:inline-block;font-size:.6rem;font-weight:700;color:var(--gold);
    background:rgba(213,166,125,.15);border-radius:6px;padding:1px 6px;margin-left:6px;
    vertical-align:middle;
  }
  .tx-section{margin-bottom:14px;margin-top:16px;}
  .tx-title{font-size:.78rem;font-weight:700;margin-bottom:8px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .tx-count{font-size:.68rem;font-weight:600;color:var(--ink-soft);}
  .tx-filter-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
  .tx-chip{font-size:.66rem;padding:3px 8px;}
  .tx-list{
    border:1px solid var(--line);border-radius:8px;overflow:hidden;
    max-height:320px;overflow-y:auto;
  }
  .tx-row{
    display:grid;grid-template-columns:.8fr .6fr .95fr 1.1fr .8fr;gap:6px;align-items:center;
    padding:6px 10px;font-size:.72rem;border-bottom:1px solid var(--line);
  }
  .tx-row:last-child{border-bottom:none;}
  .tx-row:nth-child(even){background:var(--paper);}
  .tx-row:not(.tx-row-head):hover{background:#eef1fb;}
  .tx-row-head{
    font-size:.64rem;font-weight:700;color:var(--ink-soft);
    background:var(--paper)!important;text-transform:none;
    position:sticky;top:0;z-index:1;
  }
  .tx-row-head span:last-child{text-align:right;}
  .tx-date{color:var(--ink-soft);}
  .tx-area{color:var(--ink-soft);}
  .tx-floor{font-weight:700;color:var(--ink);}
  .tx-amt{font-weight:700;}
  .tx-change{font-weight:700;text-align:right;}
  .tx-change-up{color:#c1443c;}
  .tx-change-down{color:#2f6fd6;}
  .tx-change-flat{color:var(--ink-soft);}
  .tx-change-na{color:var(--ink-soft);font-weight:600;font-size:.66rem;}
  .premium-list{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:2px;}
  .premium-row{display:grid;grid-template-columns:1fr .55fr 1fr;gap:6px;align-items:center;padding:6px 10px;font-size:.72rem;border-bottom:1px solid var(--line);}
  .premium-row:last-child{border-bottom:none;}
  .premium-row:nth-child(even){background:var(--paper);}
  .premium-row-head{font-size:.64rem;font-weight:700;color:var(--ink-soft);background:var(--paper)!important;}
  .premium-row-head span:last-child{text-align:right;}
  .premium-amt{font-weight:700;text-align:right;}
  .unittype-list{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:2px;}
  .unittype-row{display:grid;grid-template-columns:.6fr .7fr .6fr 1.1fr .5fr;gap:6px;align-items:center;padding:6px 10px;font-size:.72rem;border-bottom:1px solid var(--line);}
  .unittype-row a, .unittype-row .floorplan-link{color:var(--indigo);font-weight:600;background:none;border:none;padding:0;font:inherit;cursor:pointer;text-decoration:underline;}
  .unittype-row:last-child{border-bottom:none;}
  .unittype-row:nth-child(even){background:var(--paper);}
  .unittype-row-head{font-size:.64rem;font-weight:700;color:var(--ink-soft);background:var(--paper)!important;}
  .floorplan-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;}
  .floorplan-modal.open{display:flex;}
  .floorplan-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);}
  .floorplan-modal-content{position:relative;background:#fff;border-radius:12px;padding:18px;max-width:min(90vw,720px);max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35);}
  .floorplan-modal-close{position:absolute;top:8px;right:8px;width:32px;height:32px;border:none;background:var(--paper);border-radius:50%;font-size:1.1rem;line-height:1;cursor:pointer;color:var(--ink);}
  .floorplan-modal-title{font-weight:700;font-size:.85rem;margin:0 32px 10px 2px;}
  .floorplan-modal-img{display:block;max-width:100%;max-height:72vh;margin:0 auto;border-radius:8px;}
  .unittype-name{font-weight:700;}
  .scheduled-info-box{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:.75rem;line-height:1.6;}
  .scheduled-info-box a{color:var(--status-scheduled);}
  .floor-chart{width:100%;height:auto;display:block;background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;}
  .sim-section{margin-bottom:16px;}
  .sim-box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--paper);}
  .sim-box:last-child{margin-bottom:0;}
  .sim-box-title{font-size:.74rem;font-weight:700;margin-bottom:8px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .sim-baseline{font-size:.68rem;color:var(--ink-soft);margin-bottom:8px;line-height:1.6;}
  .sim-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .sim-row label{font-size:.7rem;color:var(--ink-soft);flex:0 0 auto;}
  .sim-input{
    flex:1 1 auto;min-width:90px;font-size:.78rem;font-weight:700;padding:5px 8px;
    border:1px solid var(--line-strong);border-radius:6px;color:var(--ink);background:#fff;
  }
  .sim-input:focus{outline:2px solid var(--gold);outline-offset:0;}
  .sim-unit{font-size:.68rem;color:var(--ink-soft);flex:0 0 auto;}
  .sim-result{font-size:.72rem;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .sim-result-row{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;}
  .sim-result-row .k{color:var(--ink-soft);}
  .sim-result-row .v{font-weight:700;}
  .sim-gap-badge{
    display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;
    border-radius:999px;color:#fff;margin-left:6px;
  }
  .sim-est-tag{
    display:inline-block;font-size:.6rem;font-weight:700;color:#a15a1f;
    background:rgba(213,166,125,.18);border-radius:6px;padding:1px 6px;margin-left:4px;
    vertical-align:middle;
  }
  .chart-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.68rem;color:var(--ink-soft);margin-bottom:6px;}
  .chart-legend-item{display:flex;align-items:center;gap:4px;}
  .chart-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .floor-premium-callout{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.76rem;line-height:1.4;color:var(--ink);margin-bottom:8px;}
  .floor-premium-callout b{color:var(--ink);}
  .floor-gap-note{display:flex;gap:6px;align-items:flex-start;font-size:.72rem;line-height:1.5;color:var(--ink-soft);margin-top:6px;padding:2px 2px 0;}
  .floor-gap-note .icon{flex:0 0 auto;}
  .data-loading-note{padding:40px 16px;text-align:center;color:var(--ink-soft);font-size:.82rem;}
  @media (max-width:640px){
    .topbar{gap:8px;padding:10px 12px;}
    .filters{gap:4px;}
    .filter-btn{font-size:.7rem;padding:5px 9px;}
    .panel{width:100vw;max-width:100vw;}
  }
  #authGate{
    position:fixed;inset:0;z-index:9999;
    background:var(--indigo-deep);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  #authGate .auth-card{
    background:var(--paper-raised);
    border-radius:14px;
    padding:32px 28px;
    width:100%;max-width:320px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  #authGate .auth-title{
    font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:4px;

  // 비교단지 (인천계양 A21 주변 7개 랜드마크 인근 기존 아파트)
  // 경과연수(2026년 기준)로 4구간 색상 구분:
  //   1년 미만 = --age-under1(앰버) / 1~5년 = --age-1to5(블루) / 5~10년 = --age-5to10(틸) / 10년 초과 = --age-over10(레드) — 지도 배경(베이지)과 대비되도록 채도 높은 색으로 조정
  // presalePrice/currentPrice는 온라인상 확인 불가 시 null로 두고 "자료 없음"으로 표시 (추정치 사용 안 함)
  // build_year가 null인 비교단지(=아직 준공 전, 분양권 전매로만 거래되는 단지)는 "10년 초과"로 잘못
  // 분류되던 버그가 있었음(null - 2026 연산에서 null이 0으로 취급돼 age가 매우 크게 계산됨, 2026.09.14 발견).
  // → 준공 전 단지는 별도 "presale(준공예정)" 구간으로 분리, 타사 분양현장(competitor)과 같은 보라색(--age-presale) 사용.
  // ------------------------------------------------------------
  var CURRENT_YEAR = 2026;

  function ageBucket(buildYear){
    if (buildYear === null || buildYear === undefined) {
      return {key:"presale", label:"준공예정", color:"var(--age-presale)", textColor:"#fff"};
    }
    var age = CURRENT_YEAR - buildYear;
    if (age < 1) return {key:"under1", label:"1년 미만", color:"var(--age-under1)", textColor:"#fff"};
    if (age < 5) return {key:"1to5", label:"1~5년", color:"var(--age-1to5)", textColor:"#fff"};
    if (age <= 10) return {key:"5to10", label:"5~10년", color:"var(--age-5to10)", textColor:"#fff"};
    return {key:"over10", label:"10년 초과", color:"var(--age-over10)", textColor:"#fff"};
  }

  function formatAmt(man){
    man = Math.round(man);
    var eok = Math.floor(man/10000);
    var rest = man % 10000;
    if (eok>0 && rest>0) return eok + "억 " + rest.toLocaleString() + "만원";
    if (eok>0) return eok + "억원";
    return man.toLocaleString() + "만원";
  }

  function formatPremium(man){
    var sign = man >= 0 ? "+" : "-";
    return sign + Math.round(Math.abs(man)).toLocaleString() + "만원";
  }

  // 타입별 분양가/면적/세대수 표 — "분양예정(타사 현장)" 카테고리에서 주로 쓰지만,
  // complex_unit_types 테이블 자체는 비교단지(향후 ④번 도면 작업)에도 공용으로 쓰도록 설계함.
  function buildUnitTypesHtml(entity){
    var types = entity.unitTypes;
    if (!types || !types.length) return '';
    var rows = types.map(function(t){
      var area = (t.areaSqm === null || t.areaSqm === undefined) ? '확인불가' : (t.areaSqm + '㎡');
      var units = (t.unitsCount === null || t.unitsCount === undefined) ? '확인불가' : (t.unitsCount.toLocaleString() + '세대');
      var price = (t.priceAmt === null || t.priceAmt === undefined) ? '확인불가' : formatAmt(t.priceAmt);
      var extra = [];
      if (t.structureType) extra.push(t.structureType);
      if (t.hasAlphaRoom === true) extra.push('알파룸 있음');
      if (t.roomCount !== null && t.roomCount !== undefined) extra.push(t.roomCount + '개룸');
      var priceCell = price + (extra.length ? (' <span style="color:var(--ink-soft);font-size:.9em;">(' + extra.join(' · ') + ')</span>') : '');
      var planCell = t.floorPlanUrl
        ? ('<button type="button" class="floorplan-link" data-plan-url="' + t.floorPlanUrl + '" data-plan-title="' + t.typeName + '">도면보기</button>')
        : '<span style="color:var(--ink-soft);">-</span>';
      return '<div class="unittype-row"><span class="unittype-name">' + t.typeName + '</span>' +
        '<span>' + area + '</span><span>' + units + '</span><span>' + priceCell + '</span><span>' + planCell + '</span></div>';
    }).join('');
    return '<div class="tx-section">' +
      '<div class="section-label tx-title">타입별 정보</div>' +
      '<div class="unittype-list">' +
        '<div class="unittype-row unittype-row-head"><span>타입</span><span>전용면적</span><span>세대수</span><span>분양가</span><span>도면</span></div>' +
        rows +
      '</div>' +
    '</div>';
  }

  // 도면 이미지를 지도 화면 가운데 모달로 바로 보여줌(외부 사이트 새 탭 이동 없이 사이트 내에서 확인).
  function openFloorPlanModal(url, title){
    if (!url) return;
    var modal = document.getElementById("floorPlanModal");
    var img = document.getElementById("floorPlanModalImg");
    var titleEl = document.getElementById("floorPlanModalTitle");
    img.src = url;
    titleEl.textContent = (title ? (title + " ") : "") + "도면";
    modal.classList.add("open");
  }
  function closeFloorPlanModal(){
    var modal = document.getElementById("floorPlanModal");
    modal.classList.remove("open");
    document.getElementById("floorPlanModalImg").src = "";
  }

  // "분양예정(타사 현장)" 안내 상자 — 모집공고일·접수기간·출처를 보여줌.
  // 이 카테고리는 아직 분양권 전매 실거래가 없는(=시뮬레이터/층별프리미엄 분석 대상이 아닌) 단지라는 점을
  // 명확히 알리는 목적도 있음(추정 데이터가 아니라 "아직 데이터가 없다"는 사실 자체를 보여줌).
  function buildScheduledInfoHtml(p){
    if (p.status !== "scheduled") return '';
    var lines = [];
    lines.push('아직 분양권 전매 실거래가 없어 층별 프리미엄·변동률 분석은 제공되지 않습니다. 모집공고 기준 정보만 표시합니다.');
    if (p.recruitNoticeDate) lines.push('모집공고일: ' + p.recruitNoticeDate);
    if (p.subscriptionPeriodText) lines.push('청약 일정: ' + p.subscriptionPeriodText);
    var srcHtml = p.sourceUrl ? ('<div>출처: <a href="' + p.sourceUrl + '" target="_blank" rel="noopener">공고문/기사 링크</a></div>') : '';
    return '<div class="scheduled-info-box">' + lines.map(function(l){ return '<div>' + l + '</div>'; }).join('') + srcHtml + '</div>';
  }

  // 저층/중층/고층: 건물 전체 층수의 1/3씩이 아니라, "저층(기피층)은 절대 층수 기준 1~5층 고정
  // + 나머지(6층~최고층)를 중층/고층으로 절반씩" 나누는 방식. 실제 분양·거래 관행상 기피층 프리미엄은
  // 건물이 높다고 비례해서 넓어지지 않고 대략 5층 안팎에서 대부분 해소된다는 점을 반영(2026.09 조정).
  // 예: 29층 건물 → 저층 1~5, 중층 6~17, 고층 18~29. 39층 건물 → 저층 1~5, 중층 6~22, 고층 23~39.
  // 실제 설계 총 층수와 다를 수 있음(비교단지는 등기부·설계도 확인이 어려워 관찰값(maxFloorObs)으로 근사).
  function floorBucketLabel(floor, maxFloor){
    if (!maxFloor || maxFloor <= 0) return "";
    if (floor <= 5) return "저층";
    if (maxFloor <= 5) return "저층"; // 저층 상한보다 낮은 건물은 전부 저층 취급
    var remaining = maxFloor - 5;
    var midCutoff = 5 + Math.ceil(remaining / 2);
    if (floor <= midCutoff) return "중층";
    return "고층";
  }

  function areaLabel(area){
    return Math.round(area) + "㎡";
  }

  // 최초분양가(또는 준공 후 실거래가 대용치) 대비 변동률(%). 면적이 다를 수 있으므로
  // 단위면적당 가격(㎡당, 3.3으로 나누면 평당이지만 비율 계산에는 어느 쪽이든 무관)으로
  // 환산해 비교한다. 기준값이 없으면 null 반환.
  function pctChange(txAmt, txArea, baseAmt, baseArea){
    if (!baseAmt || !baseArea || !txAmt || !txArea) return null;
    var txPerArea = txAmt / txArea;
    var basePerArea = baseAmt / baseArea;
    if (!basePerArea) return null;
    return (txPerArea / basePerArea - 1) * 100;
  }

  function formatPctChange(pct){
    if (pct === null || pct === undefined || isNaN(pct)) return '<span class="tx-change tx-change-na">비교불가</span>';
    var sign = pct > 0 ? "+" : "";
    var cls = pct > 0 ? "tx-change-up" : (pct < 0 ? "tx-change-down" : "tx-change-flat");
    return '<span class="tx-change ' + cls + '">' + sign + pct.toFixed(1) + "%</span>";
  }

  // presalePrice: 뉴스·입주자모집공고 등에서 확인된 "최초 분양가". 확인 안 되는 단지는
  //   TX_HISTORY_DATA의 earliestProxy(국토부 실거래가 중 확보 가능한 가장 이른 거래)를
  //   "(준공 후 실거래가)"로 명시해 대신 표기 — 실제 분양가로 오인되지 않도록 라벨을 남김.
  // currentPrice: 국토부 실거래가 API에서 2025.09~2026.08 사이 조회한 거래 중 A21 주력 타입(전용 84㎡)에
  //   가장 가까운 면적의 최근 거래 1건 (단지마다 거래량이 적어 84㎡ 표본이 없는 곳은 확보 가능한 가장 가까운 면적 사용)
  // TX_HISTORY_DATA: 국토부 실거래가 공개시스템(rt.molit.go.kr)에서 인천 계양구 아파트 매매를
  //   2021.01~2026.08 구간 월 단위로 빠짐없이 전수조사(조건별 자료제공, CSV 다운로드)한 결과.
  //   txHistory에는 전용 60㎡ 초과 거래만 포함(60㎡ 이하는 A21 비교 실익이 낮아 제외).
  //   earliestProxy는 위 전수조사 이전에 확보했던 값(대부분 2006~2010년대 최초 확보 거래)을 그대로

  function supabaseFetchAll(table, selectCols, orderCol){
    var pageSize = 1000;
    function fetchPage(from){
      var to = from + pageSize - 1;
      return fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=" + selectCols + "&order=" + (orderCol || "id"), {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: "Bearer " + SUPABASE_ANON_KEY,
          Range: from + "-" + to
        }
      }).then(function(res){
        if (!res.ok) { throw new Error(table + " 조회 실패 (HTTP " + res.status + ")"); }
        return res.json().then(function(rows){
          if (!rows || rows.length < pageSize) return rows || [];
          return fetchPage(from + pageSize).then(function(more){ return rows.concat(more); });
        });
      });
    }
    return fetchPage(0);
  }

  // 성공/보통/실패 자동 분류 — Supabase의 v_complex_classification 뷰와 동일한 규칙을
  // 프론트엔드에서도 그대로 적용(별도 조회 없이 이미 불러온 complexes 값으로 즉시 계산).
  // 타사 현장(competitor)에만 적용되고, 비교단지·당사 현장은 판정 대상이 아니라 null을 반환.
  function computeSuccessClassification(row){
    if (row.role !== "competitor") return null;
    if (row.sale_stage !== "completed") return "미분류";
    var rate = (row.avg_competition_rate === null || row.avg_competition_rate === undefined) ? null : Number(row.avg_competition_rate);
    var hadUnsold = row.had_unsold_history; // true / false / null
    var unsoldResolved = row.unsold_resolved; // true / false / null
    if (rate === null && (hadUnsold === null || hadUnsold === undefined)) return "미분류";
    if (hadUnsold === true && unsoldResolved === false) return "실패";
    if (hadUnsold !== true && rate !== null && rate >= CLASSIFICATION_RULES.success_min_rate) return "성공";
    if ((hadUnsold === true && unsoldResolved === true) ||
        (rate !== null && rate >= CLASSIFICATION_RULES.normal_min_rate && rate < CLASSIFICATION_RULES.success_min_rate)) {
      return "보통";
    }
    return "미분류";
  }

      "avg_competition_rate","had_unsold_history","unsold_resolved","sale_stage",
      "recruit_notice_date","subscription_period_text","source_url"].join(",");
    var txCols = "id,complex_id,transaction_type,area_sqm,floor,price_man,contract_date";
    var ruleCols = "rule_key,rule_value";
    // 타입별 정보(분양예정 타입별 분양가 + 추후 ④번 도면 작업에서도 같이 쓰는 테이블) — 없으면(아직 테이블 미생성) 조용히 빈 배열로.
    var unitTypeCols = "id,complex_id,type_name,area_sqm,units_count,price_amt,room_count,structure_type,has_alpha_room,floor_plan_url,note";

    return Promise.all([
      supabaseFetchAll("complexes", complexCols, "name"),
      supabaseFetchAll("transactions", txCols, "id"),
      supabaseFetchAll("classification_rules", ruleCols, "rule_key").catch(function(){ return []; }),
      supabaseFetchAll("complex_unit_types", unitTypeCols, "type_name").catch(function(){ return []; })
    ]).then(function(results){
      var complexRows = results[0];
      var txRows = results[1];
      var ruleRows = results[2] || [];
      var unitTypeRows = results[3] || [];
      var unitTypesByComplex = {};
      unitTypeRows.forEach(function(u){
        (unitTypesByComplex[u.complex_id] = unitTypesByComplex[u.complex_id] || []).push({
          typeName: u.type_name,
          areaSqm: (u.area_sqm === null || u.area_sqm === undefined) ? null : Number(u.area_sqm),
          unitsCount: (u.units_count === null || u.units_count === undefined) ? null : Number(u.units_count),
          priceAmt: (u.price_amt === null || u.price_amt === undefined) ? null : Number(u.price_amt),
          roomCount: (u.room_count === null || u.room_count === undefined) ? null : Number(u.room_count),
          structureType: u.structure_type || null,
          hasAlphaRoom: (u.has_alpha_room === null || u.has_alpha_room === undefined) ? null : !!u.has_alpha_room,
          floorPlanUrl: u.floor_plan_url || null,
          note: u.note || null
        });
      });
      ruleRows.forEach(function(r){
        if (r.rule_key === "success_min_rate" && r.rule_value !== null) CLASSIFICATION_RULES.success_min_rate = Number(r.rule_value);
        if (r.rule_key === "normal_min_rate" && r.rule_value !== null) CLASSIFICATION_RULES.normal_min_rate = Number(r.rule_value);
        if (r.rule_key === "high_competitiveness_pct" && r.rule_value !== null) PRICE_GAP_RULES.high_competitiveness_pct = Number(r.rule_value);
        if (r.rule_key === "low_competitiveness_pct" && r.rule_value !== null) PRICE_GAP_RULES.low_competitiveness_pct = Number(r.rule_value);
        if (r.rule_key === "large_unit_discount_pct" && r.rule_value !== null) PRICING_RULES.large_unit_discount_pct = Number(r.rule_value);
      });

      var txByComplex = {};
      txRows.forEach(function(t){
        (txByComplex[t.complex_id] = txByComplex[t.complex_id] || []).push(t);
      });

      COMPARISON_COMPLEXES.length = 0;
      PROJECTS.length = 0;

      complexRows.forEach(function(row){
        var rawTx = txByComplex[row.id] || [];
        var txs = rawTx.map(function(t){
          var parts = (t.contract_date || "").split("-");
          return {
            f: t.floor,
            amt: (t.price_man === null || t.price_man === undefined) ? null : Number(t.price_man),
            area: (t.area_sqm === null || t.area_sqm === undefined) ? null : Number(t.area_sqm),
            y: parts[0] ? parseInt(parts[0], 10) : null,
            m: parts[1] ? parseInt(parts[1], 10) : null,
            d: parts[2] ? parseInt(parts[2], 10) : null,
            type: t.transaction_type
          };
        });

        if (row.role === "comparison") {
          var c = {
            id: row.id,
            name: row.name,

            currentPrice: row.current_price_note || null,
            maxFloorObs: row.max_floor_obs || null,

            baselineArea: (row.baseline_area === null || row.baseline_area === undefined) ? null : Number(row.baseline_area),
            presaleIsProxy: !!row.presale_is_proxy,

          c.age = ageBucket(c.buildYear);

        } else {

            block: row.block,
            address: row.address,
            fallbackLatLng: (row.lat !== null && row.lat !== undefined && row.lng !== null && row.lng !== undefined)
              ? [Number(row.lat), Number(row.lng)] : null,
            status: row.map_status || (row.role === "own_upcoming" ? "upcoming" : "competitor"),
            statusLabel: row.status_label,

            dateLabel: row.date_label,

            presalePrice: row.presale_price_note || null,

            unsoldStatus: row.unsold_status_note || null,

  // 주력 타입(예: 84형) 기준가 — 기준 단지들의 실거래를 전부 모아 가중평균(거래 1건=1표)으로 계산.
  function computeMainTypeBaseline(cfg){
    var all = COMPARISON_COMPLEXES.concat(PROJECTS);
    var allTx = [];
    cfg.baselineComplexNames.forEach(function(name){
      var entity = all.find(function(x){ return x.name === name; });
      if (!entity || !entity.txHistory) return;
      entity.txHistory.forEach(function(t){
        if (!t.area || !t.amt || !t.y) return;
        if (t.y < cfg.minYear) return;
        if (t.area < cfg.mainType.areaMin || t.area > cfg.mainType.areaMax) return;
        if (t.type !== "regular_sale" && t.type !== "presale_resale") return;
        allTx.push(t);
      });
    });
    if (!allTx.length) return null;
    var totalAmt = allTx.reduce(function(a,t){ return a + t.amt; }, 0);
    var totalPy = allTx.reduce(function(a,t){ return a + (t.area / PYEONG_SQM); }, 0);
    return {
      txCount: allTx.length,
      weightedAvgAmt: totalAmt / allTx.length,
      weightedPricePerPy: totalAmt / totalPy
    };
  }

  // "참고용" 인근 단지 그룹(cfg.referenceGroups의 항목 하나) — 기준가 계산에는 넣지 않고
  // 화면에 실거래 통계만 별도 표시. computeMainTypeBaseline과 동일한 필터(연식·면적·거래유형)를
  // group.names에 적용. 프로젝트 하나에 여러 참고 그룹(예: 명지 + 사송신도시)을 동시에 둘 수 있다.
  function computeReferenceStats(cfg, group){
    if (!group) return null;
    var all = COMPARISON_COMPLEXES.concat(PROJECTS);
    var allTx = [];
    group.names.forEach(function(name){
      var entity = all.find(function(x){ return x.name === name; });
      if (!entity || !entity.txHistory) return;
      entity.txHistory.forEach(function(t){
        if (!t.area || !t.amt || !t.y) return;
        if (t.y < cfg.minYear) return;
        if (t.area < cfg.mainType.areaMin || t.area > cfg.mainType.areaMax) return;
        if (t.type !== "regular_sale" && t.type !== "presale_resale") return;
        allTx.push(t);
      });
    });
    if (!allTx.length) return null;
    var totalAmt = allTx.reduce(function(a,t){ return a + t.amt; }, 0);
    var totalPy = allTx.reduce(function(a,t){ return a + (t.area / PYEONG_SQM); }, 0);
    return {
      txCount: allTx.length,
      weightedAvgAmt: totalAmt / allTx.length,
      weightedPricePerPy: totalAmt / totalPy
    };
  }

  // 비주력 타입(예: 114형) 추정가 — 실거래가 거의 없어 주력 타입 평당가에
  // "대형평형 할인율"(기본 5%, classification_rules에서 조정 가능 + 화면에서 직접 조정 가능)을 적용한 추정치.
  function computeEstimatedTypeBaseline(cfg, mainBaseline, discountPct){
    if (!mainBaseline) return null;
    var d = (discountPct === null || discountPct === undefined || isNaN(discountPct))
      ? PRICING_RULES.large_unit_discount_pct : Number(discountPct);
    var adjPricePerPy = mainBaseline.weightedPricePerPy * (1 - d/100);
    var targetPy = cfg.estimatedType.targetSqm / PYEONG_SQM;
    return {
      discountPct: d,
      pricePerPy: adjPricePerPy,
      estimatedAmt: adjPricePerPy * targetPy
    };
  }

  // 예상 분양가(만원) 대 기준가 갭%. 기준가가 없으면 null.
  function computeSimGapPct(inputAmt, baselineAmt){
    if (!inputAmt || !baselineAmt || isNaN(inputAmt)) return null;
    return ((inputAmt - baselineAmt) / baselineAmt) * 100;
  }

  // price_gap 규칙(-5%/0%)으로 상/중/하 가격경쟁력 라벨.
  function simCompetitivenessLabel(gapPct){
    if (gapPct === null || gapPct === undefined) return null;
    if (gapPct <= PRICE_GAP_RULES.high_competitiveness_pct) return "상";
    if (gapPct >= PRICE_GAP_RULES.low_competitiveness_pct) return "하";
    return "중";
  }

  // 패널이 열려있는 동안의 시뮬레이터 상태(어떤 프로젝트의 설정/기준가를 쓰는 중인지).
  // 패널을 다시 그릴 때(openPanel/openComparisonPanel)마다 갱신·초기화된다.
  var simCurrentCfg = null;
  var simCurrentMainBaseline = null;

  // 당사 분양예정 현장(own_upcoming) 패널에 표시할 시뮬레이터 HTML.
  // 설정이 없는 프로젝트(아직 SIMULATOR_CONFIG에 등록 안 된 현장)에서는 빈 문자열을 반환.
  function buildSimulatorHtml(p){
    var cfg = SIMULATOR_CONFIG[p.name];
    if (!cfg) { simCurrentCfg = null; simCurrentMainBaseline = null; return ""; }
    simCurrentCfg = cfg;
    simCurrentMainBaseline = computeMainTypeBaseline(cfg);
    var mb = simCurrentMainBaseline;

    var mainBaselineText = mb
      ? ("기준가(가중평균 · " + cfg.minYear + "년 이후 · 인근 " + cfg.baselineComplexNames.length + "개 단지 실거래 " + mb.txCount + "건): <b>" + formatAmt(Math.round(mb.weightedAvgAmt)) + "</b>")
      : "기준 단지의 실거래 데이터가 부족해 기준가를 계산할 수 없습니다.";

    var excludedNote = "";
    if (cfg.excludedComplexes && cfg.excludedComplexes.length) {
      excludedNote = '<div class="sim-baseline" style="margin-top:4px;">제외: ' +
        cfg.excludedComplexes.map(function(e){ return e.name + '(' + e.reason + ')'; }).join(', ') +
      '</div>';
    }

    var mainBox =
      '<div class="sim-box">' +
        '<div class="sim-box-title">' + cfg.mainType.label + ' 예상 분양가</div>' +
        '<div class="sim-baseline">' + mainBaselineText + '</div>' +
        excludedNote +
        '<div class="sim-row">' +
          '<label>입력</label>' +
          '<input type="number" class="sim-input" data-sim="main" placeholder="예: 65000" />' +
          '<span class="sim-unit">만원</span>' +
        '</div>' +
        '<div class="sim-result" id="simMainResult"></div>' +
      '</div>';

    var estBox = "";
    if (cfg.estimatedType) {
      estBox =
        '<div class="sim-box">' +
          '<div class="sim-box-title">' + cfg.estimatedType.label + ' 예상 분양가<span class="sim-est-tag">실거래 데이터 부족 · 추정치</span></div>' +
          '<div class="sim-baseline" id="simEstBaselineText"></div>' +
          '<div class="sim-row">' +
            '<label>대형평형 할인율</label>' +
            '<input type="number" class="sim-input" style="max-width:70px;" data-sim="discount" value="' + PRICING_RULES.large_unit_discount_pct + '" />' +
            '<span class="sim-unit">% (기본값 ' + PRICING_RULES.large_unit_discount_pct + '% · 직접 조정 가능)</span>' +
          '</div>' +
          '<div class="sim-row">' +
            '<label>입력</label>' +
            '<input type="number" class="sim-input" data-sim="est" placeholder="예: 84000" />' +
            '<span class="sim-unit">만원</span>' +
          '</div>' +
          '<div class="sim-result" id="simEstResult"></div>' +
        '</div>';
    }

    var refBoxes = "";
    if (cfg.referenceGroups && cfg.referenceGroups.length) {
      refBoxes = cfg.referenceGroups.map(function(group){
        var refStats = computeReferenceStats(cfg, group);
        var refText = refStats
          ? (group.label + " (" + cfg.minYear + "년 이후 · " + refStats.txCount + "건 가중평균): <b>" + formatAmt(Math.round(refStats.weightedAvgAmt)) + "</b>")
          : (group.label + ": 최근 실거래 없음");
        var noteHtml = group.note
          ? ('<div class="sim-baseline" style="margin-top:4px;">' + group.note + '</div>')
          : "";
        return (
          '<div class="sim-box">' +
            '<div class="sim-box-title">' + cfg.mainType.label + ' 실거래 참고<span class="sim-est-tag">기준가 계산 미포함</span></div>' +
            '<div class="sim-baseline">' + refText + '</div>' +
            noteHtml +
          '</div>'
        );
      }).join("");
    }

    var marketNoteBox = cfg.marketNote
      ? ('<div class="sim-baseline" style="margin-top:4px;">' + cfg.marketNote + '</div>')
      : "";

    return '<div class="sim-section"><div class="section-label">3단계 · 분양가 시뮬레이터</div>' + mainBox + estBox + refBoxes + marketNoteBox + '</div>';
  }

  // 시뮬레이터 입력값이 바뀔 때마다(또는 패널을 처음 열었을 때) 결과 영역만 다시 계산해서 채운다.
  // 패널 전체를 다시 그리지 않으므로 입력 중이던 값/포커스가 유지된다.
  function renderSimulatorOutputs(){
    if (!simCurrentCfg) return;
    var cfg = simCurrentCfg;
    var mb = simCurrentMainBaseline;

    var mainInput = document.querySelector('[data-sim="main"]');
    var mainResultEl = document.getElementById("simMainResult");
    if (mainInput && mainResultEl) {
      var mainAmt = parseFloat(mainInput.value);
      if (mb && !isNaN(mainAmt) && mainAmt > 0) {
        var gap = computeSimGapPct(mainAmt, mb.weightedAvgAmt);
        var label = simCompetitivenessLabel(gap);
        var gapText = (gap >= 0 ? "+" : "") + gap.toFixed(1) + "%";
        var badge = label ? ('<span class="sim-gap-badge" style="background:' + COMPETITIVENESS_COLOR[label] + '">가격경쟁력 · ' + label + '</span>') : "";
        mainResultEl.innerHTML = '<div class="sim-result-row"><span class="k">기준가 대비 갭</span><span class="v">' + gapText + badge + '</span></div>';
      } else {
        mainResultEl.innerHTML = "";
      }
    }

    if (cfg.estimatedType) {
      var discountInput = document.querySelector('[data-sim="discount"]');
      var estBaselineEl = document.getElementById("simEstBaselineText");
      var discountVal = discountInput ? parseFloat(discountInput.value) : undefined;
      var estBaseline = computeEstimatedTypeBaseline(cfg, mb, discountVal);
      if (estBaselineEl) {
        estBaselineEl.innerHTML = estBaseline
          ? ("추정 기준가(" + cfg.mainType.label + " 평당가에 할인율 " + estBaseline.discountPct + "% 적용): <b>" + formatAmt(Math.round(estBaseline.estimatedAmt)) + "</b>")
          : "기준 단지의 실거래 데이터가 부족해 추정 기준가를 계산할 수 없습니다.";
      }
      var estInput = document.querySelector('[data-sim="est"]');
      var estResultEl = document.getElementById("simEstResult");
      if (estInput && estResultEl) {
        var estAmt = parseFloat(estInput.value);
        if (estBaseline && !isNaN(estAmt) && estAmt > 0) {
          var gap2 = computeSimGapPct(estAmt, estBaseline.estimatedAmt);
          var label2 = simCompetitivenessLabel(gap2);
          var gapText2 = (gap2 >= 0 ? "+" : "") + gap2.toFixed(1) + "%";
          var badge2 = label2 ? ('<span class="sim-gap-badge" style="background:' + COMPETITIVENESS_COLOR[label2] + '">가격경쟁력 · ' + label2 + '</span>') : "";
          estResultEl.innerHTML = '<div class="sim-result-row"><span class="k">추정 기준가 대비 갭</span><span class="v">' + gapText2 + badge2 + '</span></div>';
        } else {
          estResultEl.innerHTML = "";
        }
      }
    }
  }

  function computeMaxFloor(entity){
    if (entity.maxFloorObs) return entity.maxFloorObs;
    var mx = 0;
    (entity.txHistory || []).forEach(function(t){ if (t.f && t.f > mx) mx = t.f; });
    return mx || null;
  }

  function linearRegression(points){
    var n = points.length;
    if (n < 2) return null;
    var sumX=0, sumY=0, sumXY=0, sumXX=0;
    points.forEach(function(p){ sumX+=p.x; sumY+=p.y; sumXY+=p.x*p.y; sumXX+=p.x*p.x; });
    var denom = (n*sumXX - sumX*sumX);
    if (denom === 0) return null;
    var slope = (n*sumXY - sumX*sumY) / denom;
    var intercept = (sumY - slope*sumX) / n;
    return { slope: slope, intercept: intercept };
  }

  // "보기 좋은" 눈금 간격(1/2/5의 배수)을 골라 대략 targetCount개의 눈금을 만든다.
  function niceTicks(min, max, targetCount){
    var range = max - min;
    if (!isFinite(range) || range <= 0) return [min];
    var rawStep = range / targetCount;
    var mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    var norm = rawStep / mag;
    var step = (norm < 1.5) ? mag : (norm < 3 ? 2*mag : (norm < 7 ? 5*mag : 10*mag));
    var start = Math.ceil(min / step) * step;
    var ticks = [];
    for (var v = start; v <= max + step*0.001; v += step) ticks.push(Math.round(v*1000)/1000);
    return ticks;
  }

  // 시간축 눈금: 데이터 기간에 따라 분기(3개월)/반기(6개월)/연(12개월) 단위로 자동 조정.
  function buildTimeTicks(minMs, maxMs){
    var minD = new Date(minMs), maxD = new Date(maxMs);
    var spanMonths = (maxD.getFullYear()-minD.getFullYear())*12 + (maxD.getMonth()-minD.getMonth());
    var stepMonths = spanMonths <= 14 ? 3 : (spanMonths <= 30 ? 6 : 12);
    var ticks = [];
    var d = new Date(minD.getFullYear(), Math.floor(minD.getMonth()/stepMonths)*stepMonths, 1);
    var guard = 0;
    while (d.getTime() <= maxMs && guard < 60) {
      if (d.getTime() >= minMs) ticks.push(d.getTime());
      d = new Date(d.getFullYear(), d.getMonth()+stepMonths, 1);
      guard++;
    }
    return { ticks: ticks, stepMonths: stepMonths };
  }

  function formatTickDate(ms, stepMonths){
    var d = new Date(ms);
    if (stepMonths >= 12) return String(d.getFullYear());
    return d.getFullYear() + "." + String(d.getMonth()+1).padStart(2,"0");
  }

  function formatAxisPrice(v){
    v = Math.round(v);
    if (Math.abs(v) >= 10000) return (v/10000).toFixed(v % 10000 === 0 ? 0 : 1) + "억";
    return v.toLocaleString();
  }

  // 층구간(저/중/고층)별 평균 평당가 + 표본 수 계산
  function computeTierStats(entity){
    var maxFloor = computeMaxFloor(entity);
    var txs = (entity.txHistory || []).filter(function(t){ return t.area && t.amt && t.y && t.f; });
    var groups = {};
    txs.forEach(function(t){
      var pricePerPyeong = (t.amt / t.area) * PYEONG_SQM; // 만원/평 (전용면적 기준, 3.3㎡=1평)
      var tier = floorBucketLabel(t.f, maxFloor) || "미상";
      (groups[tier] = groups[tier] || []).push(pricePerPyeong);
    });
    var stats = {};
    Object.keys(groups).forEach(function(tier){
      var arr = groups[tier];
      var avg = arr.reduce(function(s,v){ return s+v; }, 0) / arr.length;
      stats[tier] = { avg: avg, n: arr.length };
    });
    return stats;
  }

  // 층구간 간 가격차(프리미엄)를 한 줄 문장으로 — 표본이 3건 이상인 층구간끼리만 비교(너무 적은 표본으로 단정하지 않도록)
  function buildFloorPremiumSummary(stats){
    var eligible = FLOOR_TIER_ORDER.filter(function(t){ return t !== "미상" && stats[t] && stats[t].n >= 3; });
    if (eligible.length < 2) return null;
    eligible.sort(function(a,b){ return stats[a].avg - stats[b].avg; });
    var loT = eligible[0], hiT = eligible[eligible.length-1];
    var diff = stats[hiT].avg - stats[loT].avg;
    var pct = (diff / stats[loT].avg) * 100;
    return {
      html: '<b>' + hiT + '</b>이 <b>' + loT + '</b>보다 평당 약 <b>' + Math.round(diff).toLocaleString() + '만원(' + (pct>=0?'+':'') + pct.toFixed(1) + '%)</b> 높게 거래됨',
      loT: loT, hiT: hiT
    };
  }

  // 상단 4px 라운드, 하단(기준선)은 각진 막대 path
  function topRoundedBarPath(x, yTop, w, yBottom, r){
    r = Math.min(r, w/2, Math.max(0, yBottom - yTop));
    return 'M' + x + ',' + yBottom +
      ' L' + x + ',' + (yTop+r) +
      ' Q' + x + ',' + yTop + ' ' + (x+r) + ',' + yTop +
      ' L' + (x+w-r) + ',' + yTop +
      ' Q' + (x+w) + ',' + yTop + ' ' + (x+w) + ',' + (yTop+r) +
      ' L' + (x+w) + ',' + yBottom + ' Z';
  }

  function renderFloorPriceChart(containerId, entity){
    var root = document.getElementById(containerId);
    if (!root) return;
    var stats = computeTierStats(entity);
    var tiers = FLOOR_TIER_ORDER.filter(function(t){ return stats[t] && stats[t].n >= 1; });
    if (tiers.length === 0) { root.innerHTML = ""; return; }

    var summary = buildFloorPremiumSummary(stats);

    var W = Math.max(240, root.clientWidth || (root.parentElement ? root.parentElement.clientWidth : 0) || 320);
    var H = 150;
    var M = { left:50, right:16, top:22, bottom:34 };
    var plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;

    var maxAvg = Math.max.apply(null, tiers.map(function(t){ return stats[t].avg; }));
    var yMax = Math.max.apply(null, niceTicks(0, maxAvg*1.15, 3).concat([maxAvg*1.05]));
    var yTicks = niceTicks(0, yMax, 3);

    function sy(v){ return H-M.bottom - (v/yMax) * plotH; }

    var slotW = plotW / tiers.length;
    var barW = Math.min(44, slotW*0.5);

    var gridAndYAxis = yTicks.map(function(v){
      var yy = sy(v);
      return '<line x1="' + M.left + '" y1="' + yy.toFixed(1) + '" x2="' + (W-M.right) + '" y2="' + yy.toFixed(1) + '" stroke="#e1e0d9" stroke-width="1"/>' +
        '<text x="' + (M.left-8) + '" y="' + (yy+3).toFixed(1) + '" font-size="10" fill="#898781" text-anchor="end">' + formatAxisPrice(v) + '</text>';
    }).join('');

    var axisBaseline = '<line x1="' + M.left + '" y1="' + (H-M.bottom) + '" x2="' + (W-M.right) + '" y2="' + (H-M.bottom) + '" stroke="#c3c2b7" stroke-width="1"/>';

    var bars = tiers.map(function(tier, i){
      var slotCenter = M.left + slotW*i + slotW/2;
      var barX = slotCenter - barW/2;
      var barTop = sy(stats[tier].avg);
      var barBottom = H - M.bottom;
      var path = topRoundedBarPath(barX, barTop, barW, barBottom, 4);
      var valueLabel = Math.round(stats[tier].avg).toLocaleString();
      return '<path d="' + path + '" fill="' + FLOOR_TIER_COLOR[tier] + '"/>' +
        '<text x="' + slotCenter + '" y="' + (barTop-6) + '" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">' + valueLabel + '</text>' +
        '<text x="' + slotCenter + '" y="' + (H-M.bottom+16) + '" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">' + tier + '</text>' +
        '<text x="' + slotCenter + '" y="' + (H-M.bottom+28) + '" font-size="9.5" fill="#898781" text-anchor="middle">(' + stats[tier].n + '건)</text>';
    }).join('');

    root.innerHTML =
      '<div class="tx-section">' +
        '<div class="section-label tx-title">층별 평당가 비교 <span class="tx-count">평균 · 만원/평</span></div>' +
        (summary ? '<div class="floor-premium-callout">' + summary.html + '</div>' : '') +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" class="floor-chart" preserveAspectRatio="xMidYMid meet">' +
          gridAndYAxis + axisBaseline + bars +
        '</svg>' +
        '<div class="note">저층/중층/고층 각각의 전용면적 기준 평당 거래가격 평균입니다(개별 실거래 ' + FLOOR_TIER_ORDER.filter(function(t){return stats[t];}).reduce(function(s,t){return s+stats[t].n;},0) + '건 기준). 표본이 3건 미만인 층구간은 위 비교 문구에서 제외했습니다.</div>' +
        (entity.floorGapNote ? '<div class="floor-gap-note"><span class="icon">참고</span><span>' + entity.floorGapNote + '</span></div>' : '') +
      '</div>';
  }

  function initMap(){
    var container = document.getElementById("map");
    map = new kakao.maps.Map(container, {
      center: new kakao.maps.LatLng(36.2, 127.9),
      level: 13
    });
    map.setMaxLevel(13);
    var koreaBounds = new kakao.maps.LatLngBounds(
      new kakao.maps.LatLng(33.0, 124.5),
      new kakao.maps.LatLng(38.7, 131.0)
    );
    map.setBounds(koreaBounds);
    map.setLevel(map.getLevel() - 1); // 초기 화면이 너무 줌아웃되어 있어 한 단계 더 확대
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

    if (kakao.maps.services) {
      geocoder = new kakao.maps.services.Geocoder();
    }

    PROJECTS.forEach(function(p){
      if (geocoder) {
        geocoder.addressSearch(p.address, function(result, status){
          if (status === kakao.maps.services.Status.OK) {
            placeMarker(p, parseFloat(result[0].y), parseFloat(result[0].x));
          } else {
            placeMarker(p, p.fallbackLatLng[0], p.fallbackLatLng[1], true);
          }
        });
      } else {
        placeMarker(p, p.fallbackLatLng[0], p.fallbackLatLng[1], false);
      }
    });

    COMPARISON_COMPLEXES.forEach(function(c){
      if (geocoder) {
        geocoder.addressSearch(c.address, function(result, status){
          if (status === kakao.maps.services.Status.OK) {
            placeComparisonMarker(c, parseFloat(result[0].y), parseFloat(result[0].x));
          }
          // 지오코딩 실패 시 좌표를 알 수 없으므로 해당 비교단지는 표시하지 않음(잘못된 위치 표기 방지)
        });
      }
    });

    document.querySelectorAll(".maptype-toggle button").forEach(function(btn){
      btn.addEventListener("click", function(){
        document.querySelectorAll(".maptype-toggle button").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        var type = btn.getAttribute("data-type");
        var kType = type === "roadmap" ? kakao.maps.MapTypeId.ROADMAP
                  : type === "skyview" ? kakao.maps.MapTypeId.SKYVIEW
                  : kakao.maps.MapTypeId.HYBRID;
        map.setMapTypeId(kType);
      });
    });

    // 필터는 중복 선택 가능(예: "5~10년"과 "1년 미만"을 동시에 켜서 같이 보기) — "전체"는 단독 선택이며
    // 개별 항목을 켜면 자동으로 꺼지고, 개별 항목을 전부 끄면 다시 "전체"로 돌아온다.
    document.querySelectorAll("#unifiedFilters .filter-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = btn.getAttribute("data-filter");
        if (key === "all") {
          activeFilters = new Set(["all"]);
        } else {
          activeFilters.delete("all");
          if (activeFilters.has(key)) { activeFilters.delete(key); } else { activeFilters.add(key); }
          if (activeFilters.size === 0) { activeFilters = new Set(["all"]); }
        }
        document.querySelectorAll("#unifiedFilters .filter-btn").forEach(function(b){
          var k = b.getAttribute("data-filter");
          if (activeFilters.has(k)) { b.classList.add("active"); } else { b.classList.remove("active"); }
        });
        refreshMarkers();
      });
    });

    document.getElementById("panelClose").addEventListener("click", function(){
      document.getElementById("panel").classList.remove("open");
    });

    // 비교단지 패널 내 층별/면적별 실거래 필터 (패널이 매번 innerHTML로 다시 그려지므로 위임 방식으로 바인딩)
    document.getElementById("panelInner").addEventListener("click", function(e){
      var ft = e.target.closest("[data-txfloor]");
      if (ft) { txFloorFilter = ft.getAttribute("data-txfloor"); renderTxSection(); return; }
      var at = e.target.closest("[data-txarea]");
      if (at) { txAreaFilter = at.getAttribute("data-txarea"); renderTxSection(); return; }
      // 타입별 정보 표의 "도면보기" — 외부 사이트로 새 탭을 여는 대신 지도 화면 가운데에 모달로 바로 보여줌
      var pt = e.target.closest("[data-plan-url]");
      if (pt) { openFloorPlanModal(pt.getAttribute("data-plan-url"), pt.getAttribute("data-plan-title")); return; }
    });

    // 도면 모달 열기/닫기 (배경 클릭·닫기 버튼·Esc 키 전부 지원)
    document.getElementById("floorPlanModalClose").addEventListener("click", closeFloorPlanModal);
    document.getElementById("floorPlanModalBackdrop").addEventListener("click", closeFloorPlanModal);
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape") closeFloorPlanModal();
    });

    // 3단계 분양가 시뮬레이터 입력(예상 분양가/할인율) — 입력할 때마다 결과만 다시 계산해서 채움(위임 방식).
    document.getElementById("panelInner").addEventListener("input", function(e){
      if (e.target.closest("[data-sim]")) { renderSimulatorOutputs(); }
    });
  }

  function placeMarker(p, lat, lng, approximate){
    var pos = new kakao.maps.LatLng(lat, lng);
    var el = document.createElement("div");
    var isBrand = (p.status === "upcoming"); // 당사(대방) 현장은 D 로고 마커, 그 외(타사 현장 등)는 색상 원 마커
    if (isBrand) {
      el.className = "marker-pin marker-pin-brand";
      el.innerHTML =
        '<div class="marker-dot-brand"><img src="' + BRAND_ICON_DATA + '" alt=""></div>' +
        '<div class="marker-label marker-label-brand">' + p.shortLabel + '</div>';
    } else {
      el.className = "marker-pin marker-pin-sm";
      el.innerHTML =
        '<div class="marker-dot marker-dot-sm" style="background:' + STATUS_COLOR[p.status] + '"></div>' +
        '<div class="marker-label marker-label-sm">' + p.shortLabel + '</div>';
    }
    el.addEventListener("click", function(){ openPanel(p, approximate); });

    var overlay = new kakao.maps.CustomOverlay({
      position: pos, content: el, yAnchor: 0.5, xAnchor: 0.5, zIndex: (isBrand ? 100 : 3)
    });
    overlay.setMap(map);
    markers.push({kind:"project", data:p, overlay:overlay});
    refreshMarkers();
  }

  function placeComparisonMarker(c, lat, lng){
    var pos = new kakao.maps.LatLng(lat, lng);
    var el = document.createElement("div");
    el.className = "marker-pin marker-pin-sm";
    el.innerHTML =
      '<div class="marker-dot marker-dot-sm" style="background:' + c.age.color + '"></div>' +
      '<div class="marker-label marker-label-sm">' + c.name + '</div>';
    el.addEventListener("click", function(){ openComparisonPanel(c); });

    var overlay = new kakao.maps.CustomOverlay({
      position: pos, content: el, yAnchor: 0.5, xAnchor: 0.5, zIndex: 1
    });
    overlay.setMap(map);
    markers.push({kind:"comparison", data:c, overlay:overlay});
    refreshMarkers();
  }

  // 마커 하나가 어떤 필터 카테고리에 속하는지 계산.
  // "분양·전매 비교(타사 현장)"(status="competitor")는 준공 전 단계라는 점에서
  // 비교단지의 "준공예정"(age.key="presale")과 같은 카테고리로 합쳐서 필터링한다(둘 다 보라색·"준공예정" 필터 하나로 묶임).
  function markerFilterKey(m){
    if (m.kind === "comparison") return m.data.age.key;
    return (m.data.status === "competitor") ? "presale" : m.data.status;
  }

  function refreshMarkers(){
    markers.forEach(function(m){
      var key = markerFilterKey(m);
      var visible = activeFilters.has("all") || activeFilters.has(key);
      m.overlay.setMap(visible ? map : null);
    });
  }

  function openPanel(p, approximate){
    var badge = '<span class="status-badge" style="background:' + STATUS_COLOR[p.status] + '">' + p.statusLabel + '</span>';
    if (p.successClassification && CLASSIFICATION_COLOR[p.successClassification]) {
      badge += '<span class="classification-badge" style="background:' + CLASSIFICATION_COLOR[p.successClassification] + '">분양성과 · ' + p.successClassification + '</span>';
    }
    var approxNote = approximate
      ? '<div class="note" style="margin-bottom:10px;color:#a15a1f;">⚠ 주소 지오코딩에 실패해 근사 좌표로 표시 중입니다. 카카오 키/도메인 등록을 확인해주세요.</div>'
      : '';
    var extraStats = '';
    if (p.presalePrice) {
      extraStats += '<div class="stat-cell"><div class="k">분양가</div><div class="v">' + p.presalePrice + '</div></div>';
    }
    if (p.competitionRate) {
      extraStats += '<div class="stat-cell"><div class="k">청약경쟁률</div><div class="v">' + p.competitionRate + '</div></div>';
    }
    if (p.unsoldStatus) {
      extraStats += '<div class="stat-cell"><div class="k">미분양 여부</div><div class="v">' + p.unsoldStatus + '</div></div>';
    }
    var premiumHtml = '';
    if (p.floorPremium && p.floorPremium.byFloor && p.floorPremium.byFloor.length) {
      var premRows = p.floorPremium.byFloor.map(function(b){
        return '<div class="premium-row"><span>' + b.label + '</span><span>n=' + b.n + '</span>' +
          '<span class="premium-amt">' + formatPremium(b.avg) + '</span></div>';
      }).join('');
      premiumHtml =
        '<div class="tx-section">' +
          '<div class="section-label tx-title">분양가 대비 현재 피(프리미엄) — 층별</div>' +
          (p.floorPremium.note ? '<div class="note" style="margin:0 0 8px;">' + p.floorPremium.note + '</div>' : '') +
          '<div class="premium-list">' +
            '<div class="premium-row premium-row-head"><span>층구간</span><span>표본</span><span>평균 피</span></div>' +
            premRows +
          '</div>' +
        '</div>';
    }
    var noteText = p.panelNote || '완공사진 · 현재 대지사진 · 조감도 · 타입별 실내 사진은 자료 전달 시 이 패널에 갤러리로 추가할 수 있습니다.';
    var simulatorHtml = (p.status === "scheduled") ? '' : buildSimulatorHtml(p); // 분양예정(타사현장)은 실거래가 없어 시뮬레이터 기준가 대상에서 제외
    var scheduledInfoHtml = buildScheduledInfoHtml(p);
    var unitTypesHtml = buildUnitTypesHtml(p);
    document.getElementById("panelInner").innerHTML =
      badge +
      '<h2>' + p.name + '</h2>' +
      '<div class="sub">' + p.block + ' · ' + p.dateLabel + '</div>' +
      approxNote +
      scheduledInfoHtml +
      '<div class="section-label">기본정보</div>' +
      '<div class="stat-grid">' +
        '<div class="stat-cell"><div class="k">세대수</div><div class="v">' + p.units + '세대</div></div>' +
        '<div class="stat-cell"><div class="k">타입</div><div class="v">' + p.typeInfo + '</div></div>' +
        extraStats +
      '</div>' +
      '<div class="addr-box"><div class="k">주소</div>' + p.address + '</div>' +
      unitTypesHtml +
      simulatorHtml +
      premiumHtml +
      '<div id="floorChartRoot"></div>' +
      '<div class="note">' + noteText + '</div>';
    document.getElementById("panel").classList.add("open");
    renderFloorPriceChart("floorChartRoot", p);
    renderSimulatorOutputs();
  }

  function openComparisonPanel(c){
    currentComplex = c;
    txFloorFilter = "all";
    txAreaFilter = "all";
    simCurrentCfg = null;
    simCurrentMainBaseline = null;
    var age = c.age;
    var badge = '<span class="status-badge" style="background:' + age.color + ';color:' + age.textColor + '">비교단지 · ' + age.label + '</span>';
    var presaleLabel = c.presaleIsProxy ? '최초 분양가 <span class="proxy-tag">준공 후 실거래가 대용</span>' : '최초 분양가';
    var presale = c.presalePrice ? c.presalePrice : '자료 없음 (온라인 확인 불가)';
    var maxFloorTxt = c.maxFloorObs ? (c.maxFloorObs + "층") : "자료 없음";
    var buildYearTxt = c.buildYear ? ("준공 " + c.buildYear + "년") : "준공예정(미준공)";
    var elapsedTxt = c.buildYear ? ((CURRENT_YEAR - c.buildYear) + "년") : "-";
    var unitsTxt = c.units ? (c.units + "세대") : "확인 안됨";
    document.getElementById("panelInner").innerHTML =
      badge +
      '<h2>' + c.name + '</h2>' +
      '<div class="sub">' + buildYearTxt + ' · ' + c.landmark + '</div>' +
      '<div class="section-label">기본정보</div>' +
      '<div class="stat-grid">' +
        '<div class="stat-cell"><div class="k">세대수</div><div class="v">' + unitsTxt + '</div></div>' +
        '<div class="stat-cell"><div class="k">경과연수</div><div class="v">' + elapsedTxt + '</div></div>' +
        '<div class="stat-cell"><div class="k">최고층수(관찰)</div><div class="v">' + maxFloorTxt + '</div></div>' +
        '<div class="stat-cell"><div class="k">거래건수(21.01~26.08)</div><div class="v">' + c.txHistory.length + '건</div></div>' +
      '</div>' +
      '<div class="addr-box"><div class="k">주소</div>' + c.address + '</div>' +
      '<div class="addr-box"><div class="k">' + presaleLabel + '</div>' + presale + '</div>' +
      buildUnitTypesHtml(c) +
      '<div id="floorChartRoot"></div>' +
      '<div id="txSectionRoot"></div>' +
      '<div class="note">분양가는 뉴스·분양공고 등 온라인에서 확인 가능한 자료만 반영했고, 확인이 안 되는 단지는 국토부 실거래가 중 가장 이른 거래를 "준공 후 실거래가"로 표시했습니다(추정 아님, 실제 거래가). 실거래 내역은 2021.01~2026.08 국토부 실거래가(매매)를 월 단위로 빠짐없이 전수조사한 결과입니다(60㎡ 이하 제외). 최고층수는 조사된 거래에서 관찰된 값으로 실제 설계 층수와 다를 수 있고, 향(방향)별 데이터는 국토부 자료에 없어 이번엔 제외했습니다.</div>';
    document.getElementById("panel").classList.add("open");
    renderFloorPriceChart("floorChartRoot", c);
    renderTxSection();
  }

  function renderTxSection(){
    var c = currentComplex;
    if (!c) return;
    var root = document.getElementById("txSectionRoot");
    if (!root) return;
    var txs = c.txHistory || [];
    if (txs.length === 0) {
      root.innerHTML = '<div class="tx-section"><div class="tx-title">층별·면적별 실거래 내역</div><div class="note">국토부 실거래가 표본에서 확인된 거래가 없습니다.</div></div>';
      return;
    }
    var areaLabels = [];
    txs.forEach(function(t){
      var lab = areaLabel(t.area);
      if (areaLabels.indexOf(lab) === -1) areaLabels.push(lab);
    });
    areaLabels.sort(function(a,b){ return parseInt(a) - parseInt(b); });

    var floorChips = ["all","저층","중층","고층"].map(function(f){
      var label = f === "all" ? "전체" : f;
      var active = (txFloorFilter === f) ? " active" : "";
      return '<button class="filter-btn tx-chip' + active + '" data-txfloor="' + f + '">' + label + '</button>';
    }).join("");

    var areaChips = ['<button class="filter-btn tx-chip' + (txAreaFilter==="all"?" active":"") + '" data-txarea="all">전체</button>']
      .concat(areaLabels.map(function(lab){
        var active = (txAreaFilter === lab) ? " active" : "";
        return '<button class="filter-btn tx-chip' + active + '" data-txarea="' + lab + '">' + lab + '</button>';
      })).join("");

    var filtered = txs.filter(function(t){
      var fb = floorBucketLabel(t.f, c.maxFloorObs);
      if (txFloorFilter !== "all" && fb !== txFloorFilter) return false;
      if (txAreaFilter !== "all" && areaLabel(t.area) !== txAreaFilter) return false;
      return true;
    });
    filtered.sort(function(a,b){
      if (b.y !== a.y) return b.y - a.y;
      if (b.m !== a.m) return b.m - a.m;
      return (b.d||0) - (a.d||0);
    });

    var rows = filtered.map(function(t){
      var fb = floorBucketLabel(t.f, c.maxFloorObs);
      var pct = pctChange(t.amt, t.area, c.baselineAmt, c.baselineArea);
      return '<div class="tx-row">' +
        '<span class="tx-date">' + t.y + '.' + String(t.m).padStart(2,"0") + '</span>' +
        '<span class="tx-area">' + areaLabel(t.area) + '</span>' +
        '<span class="tx-floor">' + fb + '(' + t.f + '층)</span>' +
        '<span class="tx-amt">' + formatAmt(t.amt) + '</span>' +
        formatPctChange(pct) +
      '</div>';
    }).join("");
    var headerRow =
      '<div class="tx-row tx-row-head">' +
        '<span>날짜</span><span>면적</span><span>층수</span><span>가격</span><span class="tx-change">최초 대비</span>' +
      '</div>';
    if (!rows) rows = '<div class="note" style="padding:8px 0;">해당 조건의 거래 표본이 없습니다.</div>';

    var baselineNote = c.baselineAmt
      ? ('<div class="note" style="margin:-4px 0 8px;">변동률 기준: ' +
          (c.presaleIsProxy ? '준공 후 실거래가 대용치' : '최초 분양가') + ' ' +
          formatAmt(c.baselineAmt) + ' (' + c.baselineArea + '㎡) 대비 ㎡당 가격으로 환산해 계산</div>')
      : '';

    root.innerHTML =
      '<div class="tx-section">' +
        '<div class="section-label tx-title">층별·면적별 실거래 내역 <span class="tx-count">' + filtered.length + '/' + txs.length + '건</span></div>' +
        baselineNote +
        '<div class="tx-filter-row">' + floorChips + '</div>' +
        '<div class="tx-filter-row">' + areaChips + '</div>' +
        '<div class="tx-list">' + headerRow + rows + '</div>' +
      '</div>';
  }

  // Kakao SDK 로드 + 실패 시 안내 배너 표시 (인증 통과 후에만 호출됨)
  // 인증 통과 직후 호출됨: 먼저 Supabase에서 실데이터를 불러온 뒤,
  // 성공하면 기존 카카오 지도 초기화 절차(startAppAfterData)를 이어서 진행한다.
  function startApp(){
    var mapEl = document.getElementById("map");
    mapEl.style.display = "flex";
    mapEl.style.alignItems = "center";
    mapEl.style.justifyContent = "center";
    mapEl.style.color = "#9a8f78";
    mapEl.style.fontSize = "14px";
    mapEl.textContent = "데이터를 불러오는 중입니다...";

    loadDataFromSupabase().then(function(){
      startAppAfterData();
    }).catch(function(err){
      mapEl.textContent = "데이터를 불러오지 못했습니다. 잠시 후 새로고침해주세요. (" + err.message + ")";
      document.getElementById("setupBanner").textContent =
        "Supabase 데이터 로딩 실패: " + err.message + " — 네트워크 상태를 확인하거나 새로고침해주세요.";
      document.getElementById("setupBanner").style.display = "block";
    });
  }

  function startAppAfterData(){
    if (KAKAO_APP_KEY.indexOf("YOUR_KAKAO") === 0) {
      document.getElementById("setupBanner").style.display = "block";
      document.getElementById("map").style.display = "flex";
      document.getElementById("map").style.alignItems = "center";
      document.getElementById("map").style.justifyContent = "center";
      document.getElementById("map").style.color = "#9a8f78";
      document.getElementById("map").style.fontSize = "14px";
      document.getElementById("map").textContent = "카카오 키를 설정하면 이 자리에 실제 지도가 표시됩니다.";
      return;
    }
    var mapEl = document.getElementById("map");
    mapEl.textContent = "";
    mapEl.removeAttribute("style"); // startApp()에서 "데이터를 불러오는 중입니다" 표시용으로 걸어둔 인라인 스타일 제거

    var script = document.createElement("script");
    script.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" + KAKAO_APP_KEY + "&autoload=false&libraries=services";
    script.onload = function(){ kakao.maps.load(initMap); };
    script.onerror = function(){
      document.getElementById("setupBanner").textContent =
        "카카오 지도 스크립트를 불러오지 못했습니다. JavaScript 키가 올바른지, 이 파일을 여는 도메인이 카카오 디벨로퍼스에 등록되어 있는지 확인해주세요.";
      document.getElementById("setupBanner").style.display = "block";
    };
    document.head.appendChild(script);
  }
