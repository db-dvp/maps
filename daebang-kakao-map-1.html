<style>
  :root{
    --paper:#f5f1e9;
    --paper-raised:#ffffff;
    --ink:#202a5d;
    --ink-soft:#5c6790;
    --indigo:#202a5d;
    --indigo-deep:#141b40;
    --indigo-mid:#6478c8;
    --blush:#e5cedb;
    --blush-deep:#c17b9b;
    --gold:#d5a67d;
    --line:#e6ded1;
    --line-strong:#d3c7b2;
    --status-upcoming:#202a5d;
    --status-competitor:#7d5ba6;
    --age-under1:#e0a728;
    --age-1to5:#2f6fd6;
    --age-5to10:#12a39c;
    --age-over10:#c1443c;
    --shadow:0 12px 32px -12px rgba(24,27,60,.28);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow-x:hidden;}
  body{
    font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
    color:var(--ink);
    background:var(--paper);
    display:flex;flex-direction:column;
  }
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:12px 20px;background:var(--paper-raised);
    border-bottom:1px solid var(--line);
    box-shadow:var(--shadow);position:relative;z-index:20;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo-wrap{
    background:#fff;border-radius:8px;padding:4px 8px;
    display:flex;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .brand-logo{height:20px;display:block;}
  .brand small{
    display:block;font-size:.62rem;letter-spacing:.08em;color:var(--ink-soft);
    font-weight:600;margin-top:1px;
  }
  .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .filter-btn{
    border:1px solid var(--line-strong);background:var(--paper-raised);
    color:var(--ink-soft);font-size:.78rem;font-weight:600;
    padding:6px 12px;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:.15s;
  }
  .filter-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .filter-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .setup-banner{
    background:#fff3cd;border-bottom:1px solid #e2c465;color:#5c4a12;
    font-size:.82rem;padding:10px 20px;display:none;line-height:1.5;
  }
  .setup-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;}
  .stage{position:relative;flex:1;min-height:0;}
  #appRoot{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;}
  #map{width:100%;height:100%;}
  .maptype-toggle{
    position:absolute;top:14px;left:14px;z-index:10;
    background:var(--paper-raised);border-radius:10px;box-shadow:var(--shadow);
    display:flex;overflow:hidden;border:1px solid var(--line);
  }
  .maptype-toggle button{
    border:none;background:transparent;padding:8px 12px;font-size:.78rem;
    font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .maptype-toggle button.active{background:var(--indigo);color:#fff;}
  .legend{
    position:absolute;left:14px;bottom:14px;z-index:10;
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);
    font-size:.78rem;min-width:150px;max-width:220px;
  }
  .legend-title{
    font-size:.68rem;font-weight:700;letter-spacing:.03em;color:var(--ink);
    margin:10px 0 6px;padding-top:8px;border-top:1px solid var(--line);
  }
  .age-filters{display:flex;flex-direction:column;gap:5px;min-width:150px;}
  .age-filters .filter-btn{
    font-size:.74rem;padding:6px 10px;gap:7px;width:100%;
    justify-content:flex-start;box-sizing:border-box;
  }
  .marker-pin{
    position:relative;width:22px;height:22px;cursor:pointer;
  }
  .marker-dot{
    position:absolute;left:0;top:0;
    width:22px;height:22px;border-radius:50%;
    border:3px solid #fff;
    box-shadow:0 0 0 1.5px rgba(0,0,0,.45),0 2px 7px rgba(0,0,0,.45);
  }
  .marker-label{
    position:absolute;left:27px;top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,.97);color:var(--ink);
    font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;
    box-shadow:0 1px 5px rgba(0,0,0,.25);white-space:nowrap;
  }
  .marker-pin-sm{width:17px;height:17px;}
  .marker-dot-sm{
    width:17px;height:17px;border-radius:50%;
    transform:none;border:2.5px solid #fff;
    box-shadow:0 0 0 1.75px rgba(0,0,0,.55),0 1.5px 6px rgba(0,0,0,.45);
  }
  .marker-label-sm{
    left:22px;font-size:11px;font-weight:700;padding:2px 7px;
    background:rgba(255,255,255,.96);color:var(--ink-soft);
    box-shadow:0 1px 4px rgba(0,0,0,.2);
    transform:translateY(-50%);
  }
  .marker-pin-brand{width:30px;height:30px;}
  .marker-dot-brand{
    position:absolute;left:0;top:0;
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:#fff;border:2.5px solid var(--status-upcoming);
    box-shadow:0 0 0 1.5px rgba(0,0,0,.4),0 3px 9px rgba(0,0,0,.5);
  }
  .marker-dot-brand img{
    display:block;width:19px;height:19px;pointer-events:none;
  }
  .marker-label-brand{
    left:35px;font-size:12px;font-weight:800;
    background:rgba(255,255,255,.98);color:var(--ink);
    padding:3px 9px;box-shadow:0 1px 6px rgba(0,0,0,.28);
  }
  .panel{
    position:absolute;top:0;right:0;bottom:0;width:460px;max-width:94vw;
    background:var(--paper-raised);box-shadow:-8px 0 24px -12px rgba(0,0,0,.25);
    z-index:15;transform:translateX(100%);transition:transform .25s ease;
    overflow-y:auto;
    font-size:13px;
  }
  .panel.open{transform:translateX(0);}
  .panel-inner{padding:20px 24px 28px;}
  .panel-close{
    position:absolute;top:14px;right:14px;border:none;background:var(--paper);
    width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--ink-soft);
  }
  .status-badge{
    display:inline-block;font-size:.68rem;font-weight:700;padding:3px 9px;
    border-radius:999px;color:#fff;margin-bottom:8px;letter-spacing:.01em;
  }
  .panel h2{font-size:1.05rem;margin:0 0 3px;line-height:1.35;font-weight:800;}
  .panel .sub{color:var(--ink-soft);font-size:.76rem;margin-bottom:14px;}
  .section-label{
    font-size:.68rem;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;
    margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:space-between;
  }
  .stat-grid{
    display:flex;flex-direction:column;
    border-top:1px solid var(--line);margin-bottom:16px;
  }
  .stat-cell{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:7px 1px;border-bottom:1px solid var(--line);background:none;
  }
  .stat-cell .k{font-size:.72rem;color:var(--ink-soft);margin-bottom:0;flex:0 0 auto;}
  .stat-cell .v{font-size:.78rem;font-weight:700;text-align:right;line-height:1.45;}
  .addr-box{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:.76rem;margin-bottom:10px;line-height:1.5;}
  .addr-box .k{font-size:.64rem;color:var(--ink-soft);font-weight:700;margin-bottom:2px;letter-spacing:.02em;}
  .preview-banner{
    background:var(--gold);color:#fff;font-size:.7rem;font-weight:700;
    padding:6px 10px;border-radius:8px;margin-bottom:12px;
  }
  .note{font-size:.72rem;color:var(--ink-soft);line-height:1.6;}
  .proxy-tag{
    display:inline-block;font-size:.6rem;font-weight:700;color:var(--gold);
    background:rgba(213,166,125,.15);border-radius:6px;padding:1px 6px;margin-left:6px;
    vertical-align:middle;
  }
  .tx-section{margin-bottom:14px;margin-top:16px;}
  .tx-title{font-size:.78rem;font-weight:700;margin-bottom:8px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .tx-count{font-size:.68rem;font-weight:600;color:var(--ink-soft);}
  .tx-filter-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
  .tx-chip{font-size:.66rem;padding:3px 8px;}
  .tx-list{
    border:1px solid var(--line);border-radius:8px;overflow:hidden;
    max-height:320px;overflow-y:auto;
  }
  .tx-row{
    display:grid;grid-template-columns:.8fr .6fr .95fr 1.1fr .8fr;gap:6px;align-items:center;
    padding:6px 10px;font-size:.72rem;border-bottom:1px solid var(--line);
  }
  .tx-row:last-child{border-bottom:none;}
  .tx-row:nth-child(even){background:var(--paper);}
  .tx-row:not(.tx-row-head):hover{background:#eef1fb;}
  .tx-row-head{
    font-size:.64rem;font-weight:700;color:var(--ink-soft);
    background:var(--paper)!important;text-transform:none;
    position:sticky;top:0;z-index:1;
  }
  .tx-row-head span:last-child{text-align:right;}
  .tx-date{color:var(--ink-soft);}
  .tx-area{color:var(--ink-soft);}
  .tx-floor{font-weight:700;color:var(--ink);}
  .tx-amt{font-weight:700;}
  .tx-change{font-weight:700;text-align:right;}
  .tx-change-up{color:#c1443c;}
  .tx-change-down{color:#2f6fd6;}
  .tx-change-flat{color:var(--ink-soft);}
  .tx-change-na{color:var(--ink-soft);font-weight:600;font-size:.66rem;}
  .premium-list{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:2px;}
  .premium-row{display:grid;grid-template-columns:1fr .55fr 1fr;gap:6px;align-items:center;padding:6px 10px;font-size:.72rem;border-bottom:1px solid var(--line);}
  .premium-row:last-child{border-bottom:none;}
  .premium-row:nth-child(even){background:var(--paper);}
  .premium-row-head{font-size:.64rem;font-weight:700;color:var(--ink-soft);background:var(--paper)!important;}
  .premium-row-head span:last-child{text-align:right;}
  .premium-amt{font-weight:700;text-align:right;}
  @media (max-width:640px){
    .topbar{gap:8px;padding:10px 12px;}
    .filters{gap:4px;}
    .filter-btn{font-size:.7rem;padding:5px 9px;}
    .panel{width:100vw;max-width:100vw;}
  }
  #authGate{
    position:fixed;inset:0;z-index:9999;
    background:var(--indigo-deep);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  #authGate .auth-card{
    background:var(--paper-raised);
    border-radius:14px;
    padding:32px 28px;
    width:100%;max-width:320px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  #authGate .auth-title{
    font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:4px;
  }
  #authGate .auth-sub{
    font-size:.72rem;color:var(--ink-soft);margin-bottom:18px;
  }
  #authGate input{
    width:100%;box-sizing:border-box;
    padding:10px 12px;margin-bottom:10px;
    border:1px solid var(--line-strong);border-radius:8px;
    font-size:.85rem;font-family:inherit;
    background:var(--paper);color:var(--ink);
  }
  #authGate input:focus{outline:2px solid var(--indigo-mid);outline-offset:1px;}
  #authGate button{
    width:100%;padding:10px 12px;border:none;border-radius:8px;
    background:var(--indigo);color:#fff;font-weight:700;font-size:.85rem;
    cursor:pointer;font-family:inherit;
  }
  #authGate button:hover{background:var(--indigo-deep);}
  #authGate .auth-error{
    color:#c1443c;font-size:.72rem;margin-top:10px;min-height:1em;
  }
</style>
</head>
<body>

  <div id="authGate">
    <div class="auth-card">
      <div class="auth-title">ELIUM PROJECT SITE MAP</div>
      <div class="auth-sub">내부 열람용 자료입니다. ID/PW를 입력해주세요.</div>
      <input type="text" id="authId" placeholder="ID" autocomplete="off">
      <input type="password" id="authPw" placeholder="PASSWORD" autocomplete="off">
      <button id="authBtn" type="button">확인</button>
      <div class="auth-error" id="authError"></div>
    </div>
  </div>

  <div id="appRoot" style="display:none;">

  // ------------------------------------------------------------
  // 비교단지 (인천계양 A21 주변 7개 랜드마크 인근 기존 아파트)
  // 경과연수(2026년 기준)로 4구간 색상 구분:
  //   1년 미만 = --age-under1(앰버) / 1~5년 = --age-1to5(블루) / 5~10년 = --age-5to10(틸) / 10년 초과 = --age-over10(레드) — 지도 배경(베이지)과 대비되도록 채도 높은 색으로 조정
  // presalePrice/currentPrice는 온라인상 확인 불가 시 null로 두고 "자료 없음"으로 표시 (추정치 사용 안 함)
  // ------------------------------------------------------------
  var CURRENT_YEAR = 2026;

  function ageBucket(buildYear){
    var age = CURRENT_YEAR - buildYear;
    if (age < 1) return {key:"under1", label:"1년 미만", color:"var(--age-under1)", textColor:"#fff"};
    if (age < 5) return {key:"1to5", label:"1~5년", color:"var(--age-1to5)", textColor:"#fff"};
    if (age <= 10) return {key:"5to10", label:"5~10년", color:"var(--age-5to10)", textColor:"#fff"};
    return {key:"over10", label:"10년 초과", color:"var(--age-over10)", textColor:"#fff"};
  }

  function formatAmt(man){
    man = Math.round(man);
    var eok = Math.floor(man/10000);
    var rest = man % 10000;
    if (eok>0 && rest>0) return eok + "억 " + rest.toLocaleString() + "만원";
    if (eok>0) return eok + "억원";
    return man.toLocaleString() + "만원";
  }

  function formatPremium(man){
    var sign = man >= 0 ? "+" : "-";
    return sign + Math.round(Math.abs(man)).toLocaleString() + "만원";
  }

  // 저층/중층/고층: 표본 거래에서 관찰된 최고층(maxFloorObs)을 3등분한 상대적 구간.
  // 실제 설계 총 층수와 다를 수 있음(비교단지는 등기부·설계도 확인이 어려워 관찰값으로 근사).
  function floorBucketLabel(floor, maxFloor){
    if (!maxFloor || maxFloor <= 0) return "";
    var ratio = floor / maxFloor;
    if (ratio <= 1/3) return "저층";
    if (ratio <= 2/3) return "중층";
    return "고층";
  }

  function areaLabel(area){
    return Math.round(area) + "㎡";
  }

  // 최초분양가(또는 준공 후 실거래가 대용치) 대비 변동률(%). 면적이 다를 수 있으므로
  // 단위면적당 가격(㎡당, 3.3으로 나누면 평당이지만 비율 계산에는 어느 쪽이든 무관)으로
  // 환산해 비교한다. 기준값이 없으면 null 반환.
  function pctChange(txAmt, txArea, baseAmt, baseArea){
    if (!baseAmt || !baseArea || !txAmt || !txArea) return null;
    var txPerArea = txAmt / txArea;
    var basePerArea = baseAmt / baseArea;
    if (!basePerArea) return null;
    return (txPerArea / basePerArea - 1) * 100;
  }

  function formatPctChange(pct){
    if (pct === null || pct === undefined || isNaN(pct)) return '<span class="tx-change tx-change-na">비교불가</span>';
    var sign = pct > 0 ? "+" : "";
    var cls = pct > 0 ? "tx-change-up" : (pct < 0 ? "tx-change-down" : "tx-change-flat");
    return '<span class="tx-change ' + cls + '">' + sign + pct.toFixed(1) + "%</span>";
  }

  // presalePrice: 뉴스·입주자모집공고 등에서 확인된 "최초 분양가". 확인 안 되는 단지는
  //   TX_HISTORY_DATA의 earliestProxy(국토부 실거래가 중 확보 가능한 가장 이른 거래)를
  //   "(준공 후 실거래가)"로 명시해 대신 표기 — 실제 분양가로 오인되지 않도록 라벨을 남김.
  // currentPrice: 국토부 실거래가 API에서 2025.09~2026.08 사이 조회한 거래 중 A21 주력 타입(전용 84㎡)에
  //   가장 가까운 면적의 최근 거래 1건 (단지마다 거래량이 적어 84㎡ 표본이 없는 곳은 확보 가능한 가장 가까운 면적 사용)
  // TX_HISTORY_DATA: 국토부 실거래가 공개시스템(rt.molit.go.kr)에서 인천 계양구 아파트 매매를
  //   2021.01~2026.08 구간 월 단위로 빠짐없이 전수조사(조건별 자료제공, CSV 다운로드)한 결과.
  //   txHistory에는 전용 60㎡ 초과 거래만 포함(60㎡ 이하는 A21 비교 실익이 낮아 제외).
  //   earliestProxy는 위 전수조사 이전에 확보했던 값(대부분 2006~2010년대 최초 확보 거래)을 그대로
  //   유지한 것으로, 분양가 대용 단일 값이라 이번 전수조사와 무관하게 별도 보존.
  // 층 구분(저층/중층/고층)은 전수조사에서 관찰된 최고층(maxFloorObs, 60㎡ 이하 포함 전체 거래 기준)을
  //   3등분한 상대적 구간이며, 건물의 실제 설계 총 층수와 다를 수 있음. 향(방향)별 데이터는
  //   국토부 자료에 없어 이번에도 제외.
  var TX_HISTORY_DATA = {

  var map, geocoder, markers = [], activeFilter = "all";

  function initMap(){
    var container = document.getElementById("map");
    map = new kakao.maps.Map(container, {
      center: new kakao.maps.LatLng(36.2, 127.9),
      level: 13
    });
    map.setMaxLevel(13);
    var koreaBounds = new kakao.maps.LatLngBounds(
      new kakao.maps.LatLng(33.0, 124.5),
      new kakao.maps.LatLng(38.7, 131.0)
    );
    map.setBounds(koreaBounds);
    map.setLevel(map.getLevel() - 1); // 초기 화면이 너무 줌아웃되어 있어 한 단계 더 확대
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

    if (kakao.maps.services) {
      geocoder = new kakao.maps.services.Geocoder();
    }

    PROJECTS.forEach(function(p){
      if (geocoder) {
        geocoder.addressSearch(p.address, function(result, status){
          if (status === kakao.maps.services.Status.OK) {
            placeMarker(p, parseFloat(result[0].y), parseFloat(result[0].x));
          } else {
            placeMarker(p, p.fallbackLatLng[0], p.fallbackLatLng[1], true);
          }
        });
      } else {
        placeMarker(p, p.fallbackLatLng[0], p.fallbackLatLng[1], false);
      }
    });

    COMPARISON_COMPLEXES.forEach(function(c){
      if (geocoder) {
        geocoder.addressSearch(c.address, function(result, status){
          if (status === kakao.maps.services.Status.OK) {
            placeComparisonMarker(c, parseFloat(result[0].y), parseFloat(result[0].x));
          }
          // 지오코딩 실패 시 좌표를 알 수 없으므로 해당 비교단지는 표시하지 않음(잘못된 위치 표기 방지)
        });
      }
    });

    document.querySelectorAll(".maptype-toggle button").forEach(function(btn){
      btn.addEventListener("click", function(){
        document.querySelectorAll(".maptype-toggle button").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        var type = btn.getAttribute("data-type");
        var kType = type === "roadmap" ? kakao.maps.MapTypeId.ROADMAP
                  : type === "skyview" ? kakao.maps.MapTypeId.SKYVIEW
                  : kakao.maps.MapTypeId.HYBRID;
        map.setMapTypeId(kType);
      });
    });

    document.querySelectorAll("#unifiedFilters .filter-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        document.querySelectorAll("#unifiedFilters .filter-btn").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        activeFilter = btn.getAttribute("data-filter");
        refreshMarkers();
      });
    });

    document.getElementById("panelClose").addEventListener("click", function(){
      document.getElementById("panel").classList.remove("open");
    });

    // 비교단지 패널 내 층별/면적별 실거래 필터 (패널이 매번 innerHTML로 다시 그려지므로 위임 방식으로 바인딩)
    document.getElementById("panelInner").addEventListener("click", function(e){
      var ft = e.target.closest("[data-txfloor]");
      if (ft) { txFloorFilter = ft.getAttribute("data-txfloor"); renderTxSection(); return; }
      var at = e.target.closest("[data-txarea]");
      if (at) { txAreaFilter = at.getAttribute("data-txarea"); renderTxSection(); return; }
    });
  }

  function placeMarker(p, lat, lng, approximate){
    var pos = new kakao.maps.LatLng(lat, lng);
    var el = document.createElement("div");
    var isBrand = (p.status === "upcoming"); // 당사(대방) 현장은 D 로고 마커, 그 외(타사 현장 등)는 색상 원 마커
    if (isBrand) {
      el.className = "marker-pin marker-pin-brand";
      el.innerHTML =
        '<div class="marker-dot-brand"><img src="' + BRAND_ICON_DATA + '" alt=""></div>' +
        '<div class="marker-label marker-label-brand">' + p.shortLabel + '</div>';
    } else {
      el.className = "marker-pin marker-pin-sm";
      el.innerHTML =
        '<div class="marker-dot marker-dot-sm" style="background:' + STATUS_COLOR[p.status] + '"></div>' +
        '<div class="marker-label marker-label-sm">' + p.shortLabel + '</div>';
    }
    el.addEventListener("click", function(){ openPanel(p, approximate); });

    var overlay = new kakao.maps.CustomOverlay({
      position: pos, content: el, yAnchor: 0.5, xAnchor: 0.5, zIndex: (isBrand ? 100 : 3)
    });
    overlay.setMap(map);
    markers.push({kind:"project", data:p, overlay:overlay});
    refreshMarkers();
  }

    var overlay = new kakao.maps.CustomOverlay({
      position: pos, content: el, yAnchor: 0.5, xAnchor: 0.5, zIndex: 1
    });
    overlay.setMap(map);
    markers.push({kind:"comparison", data:c, overlay:overlay});
    refreshMarkers();
  }

  function refreshMarkers(){
    markers.forEach(function(m){
      var visible;
      if (m.kind === "comparison") {
        visible = (activeFilter === "all") || (activeFilter === m.data.age.key);
      } else {
        visible = (activeFilter === "all") || (activeFilter === m.data.status);
      }
      m.overlay.setMap(visible ? map : null);
    });
  }

  function openPanel(p, approximate){
    var badge = '<span class="status-badge" style="background:' + STATUS_COLOR[p.status] + '">' + p.statusLabel + '</span>';
    var approxNote = approximate
      ? '<div class="note" style="margin-bottom:10px;color:#a15a1f;">⚠ 주소 지오코딩에 실패해 근사 좌표로 표시 중입니다. 카카오 키/도메인 등록을 확인해주세요.</div>'
      : '';
    var extraStats = '';
    if (p.presalePrice) {
      extraStats += '<div class="stat-cell"><div class="k">분양가</div><div class="v">' + p.presalePrice + '</div></div>';
    }
    if (p.competitionRate) {
      extraStats += '<div class="stat-cell"><div class="k">청약경쟁률</div><div class="v">' + p.competitionRate + '</div></div>';
    }
    if (p.unsoldStatus) {
      extraStats += '<div class="stat-cell"><div class="k">미분양 여부</div><div class="v">' + p.unsoldStatus + '</div></div>';
    }
    var premiumHtml = '';
    if (p.floorPremium && p.floorPremium.byFloor && p.floorPremium.byFloor.length) {
      var premRows = p.floorPremium.byFloor.map(function(b){
        return '<div class="premium-row"><span>' + b.label + '</span><span>n=' + b.n + '</span>' +
          '<span class="premium-amt">' + formatPremium(b.avg) + '</span></div>';
      }).join('');
      premiumHtml =
        '<div class="tx-section">' +
          '<div class="section-label tx-title">분양가 대비 현재 피(프리미엄) — 층별</div>' +
          (p.floorPremium.note ? '<div class="note" style="margin:0 0 8px;">' + p.floorPremium.note + '</div>' : '') +
          '<div class="premium-list">' +
            '<div class="premium-row premium-row-head"><span>층구간</span><span>표본</span><span>평균 피</span></div>' +
            premRows +
          '</div>' +
        '</div>';
    }
    var noteText = p.panelNote || '완공사진 · 현재 대지사진 · 조감도 · 타입별 실내 사진은 자료 전달 시 이 패널에 갤러리로 추가할 수 있습니다.';
    document.getElementById("panelInner").innerHTML =
      badge +
      '<h2>' + p.name + '</h2>' +
      '<div class="sub">' + p.block + ' · ' + p.dateLabel + '</div>' +
      approxNote +
      '<div class="section-label">기본정보</div>' +
      '<div class="stat-grid">' +
        '<div class="stat-cell"><div class="k">세대수</div><div class="v">' + p.units + '세대</div></div>' +
        '<div class="stat-cell"><div class="k">타입</div><div class="v">' + p.typeInfo + '</div></div>' +
        extraStats +
      '</div>' +
      '<div class="addr-box"><div class="k">주소</div>' + p.address + '</div>' +
      premiumHtml +
      '<div class="note">' + noteText + '</div>';
    document.getElementById("panel").classList.add("open");
  }

  function openComparisonPanel(c){
    currentComplex = c;
    txFloorFilter = "all";
    txAreaFilter = "all";
    var age = c.age;
    var badge = '<span class="status-badge" style="background:' + age.color + ';color:' + age.textColor + '">비교단지 · ' + age.label + '</span>';
    var presaleLabel = c.presaleIsProxy ? '최초 분양가 <span class="proxy-tag">준공 후 실거래가 대용</span>' : '최초 분양가';
    var presale = c.presalePrice ? c.presalePrice : '자료 없음 (온라인 확인 불가)';
    var maxFloorTxt = c.maxFloorObs ? (c.maxFloorObs + "층") : "자료 없음";
    document.getElementById("panelInner").innerHTML =
      badge +
      '<h2>' + c.name + '</h2>' +
      '<div class="sub">준공 ' + c.buildYear + '년 · ' + c.landmark + '</div>' +
      '<div class="section-label">기본정보</div>' +
      '<div class="stat-grid">' +
        '<div class="stat-cell"><div class="k">세대수</div><div class="v">' + c.units + '세대</div></div>' +
        '<div class="stat-cell"><div class="k">경과연수</div><div class="v">' + (CURRENT_YEAR - c.buildYear) + '년</div></div>' +
        '<div class="stat-cell"><div class="k">최고층수(관찰)</div><div class="v">' + maxFloorTxt + '</div></div>' +
        '<div class="stat-cell"><div class="k">거래건수(21.01~26.08)</div><div class="v">' + c.txHistory.length + '건</div></div>' +
      '</div>' +
      '<div class="addr-box"><div class="k">주소</div>' + c.address + '</div>' +
      '<div class="addr-box"><div class="k">' + presaleLabel + '</div>' + presale + '</div>' +
      '<div id="txSectionRoot"></div>' +
      '<div class="note">분양가는 뉴스·분양공고 등 온라인에서 확인 가능한 자료만 반영했고, 확인이 안 되는 단지는 국토부 실거래가 중 가장 이른 거래를 "준공 후 실거래가"로 표시했습니다(추정 아님, 실제 거래가). 실거래 내역은 2021.01~2026.08 국토부 실거래가(매매)를 월 단위로 빠짐없이 전수조사한 결과입니다(60㎡ 이하 제외). 최고층수는 조사된 거래에서 관찰된 값으로 실제 설계 층수와 다를 수 있고, 향(방향)별 데이터는 국토부 자료에 없어 이번엔 제외했습니다.</div>';
    document.getElementById("panel").classList.add("open");
    renderTxSection();
  }

  function renderTxSection(){
    var c = currentComplex;
    if (!c) return;
    var root = document.getElementById("txSectionRoot");
    if (!root) return;
    var txs = c.txHistory || [];
    if (txs.length === 0) {
      root.innerHTML = '<div class="tx-section"><div class="tx-title">층별·면적별 실거래 내역</div><div class="note">국토부 실거래가 표본에서 확인된 거래가 없습니다.</div></div>';
      return;
    }
    var areaLabels = [];
    txs.forEach(function(t){
      var lab = areaLabel(t.area);
      if (areaLabels.indexOf(lab) === -1) areaLabels.push(lab);
    });
    areaLabels.sort(function(a,b){ return parseInt(a) - parseInt(b); });

    var floorChips = ["all","저층","중층","고층"].map(function(f){
      var label = f === "all" ? "전체" : f;
      var active = (txFloorFilter === f) ? " active" : "";
      return '<button class="filter-btn tx-chip' + active + '" data-txfloor="' + f + '">' + label + '</button>';
    }).join("");

    var areaChips = ['<button class="filter-btn tx-chip' + (txAreaFilter==="all"?" active":"") + '" data-txarea="all">전체</button>']
      .concat(areaLabels.map(function(lab){
        var active = (txAreaFilter === lab) ? " active" : "";
        return '<button class="filter-btn tx-chip' + active + '" data-txarea="' + lab + '">' + lab + '</button>';
      })).join("");

    var filtered = txs.filter(function(t){
      var fb = floorBucketLabel(t.f, c.maxFloorObs);
      if (txFloorFilter !== "all" && fb !== txFloorFilter) return false;
      if (txAreaFilter !== "all" && areaLabel(t.area) !== txAreaFilter) return false;
      return true;
    });
    filtered.sort(function(a,b){
      if (b.y !== a.y) return b.y - a.y;
      if (b.m !== a.m) return b.m - a.m;
      return (b.d||0) - (a.d||0);
    });

    var rows = filtered.map(function(t){
      var fb = floorBucketLabel(t.f, c.maxFloorObs);
      var pct = pctChange(t.amt, t.area, c.baselineAmt, c.baselineArea);
      return '<div class="tx-row">' +
        '<span class="tx-date">' + t.y + '.' + String(t.m).padStart(2,"0") + '</span>' +
        '<span class="tx-area">' + areaLabel(t.area) + '</span>' +
        '<span class="tx-floor">' + fb + '(' + t.f + '층)</span>' +
        '<span class="tx-amt">' + formatAmt(t.amt) + '</span>' +
        formatPctChange(pct) +
      '</div>';
    }).join("");
    var headerRow =
      '<div class="tx-row tx-row-head">' +
        '<span>날짜</span><span>면적</span><span>층수</span><span>가격</span><span class="tx-change">최초 대비</span>' +
      '</div>';
    if (!rows) rows = '<div class="note" style="padding:8px 0;">해당 조건의 거래 표본이 없습니다.</div>';

    var baselineNote = c.baselineAmt
      ? ('<div class="note" style="margin:-4px 0 8px;">변동률 기준: ' +
          (c.presaleIsProxy ? '준공 후 실거래가 대용치' : '최초 분양가') + ' ' +
          formatAmt(c.baselineAmt) + ' (' + c.baselineArea + '㎡) 대비 ㎡당 가격으로 환산해 계산</div>')
      : '';

    root.innerHTML =
      '<div class="tx-section">' +
        '<div class="section-label tx-title">층별·면적별 실거래 내역 <span class="tx-count">' + filtered.length + '/' + txs.length + '건</span></div>' +
        baselineNote +
        '<div class="tx-filter-row">' + floorChips + '</div>' +
        '<div class="tx-filter-row">' + areaChips + '</div>' +
        '<div class="tx-list">' + headerRow + rows + '</div>' +
      '</div>';
  }

  // Kakao SDK 로드 + 실패 시 안내 배너 표시 (인증 통과 후에만 호출됨)
  function startApp(){
    if (KAKAO_APP_KEY.indexOf("YOUR_KAKAO") === 0) {
      document.getElementById("setupBanner").style.display = "block";
      document.getElementById("map").style.display = "flex";
      document.getElementById("map").style.alignItems = "center";
      document.getElementById("map").style.justifyContent = "center";
      document.getElementById("map").style.color = "#9a8f78";
      document.getElementById("map").style.fontSize = "14px";
      document.getElementById("map").textContent = "카카오 키를 설정하면 이 자리에 실제 지도가 표시됩니다.";
      return;
    }
    var script = document.createElement("script");
    script.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" + KAKAO_APP_KEY + "&autoload=false&libraries=services";
    script.onload = function(){ kakao.maps.load(initMap); };
    script.onerror = function(){
      document.getElementById("setupBanner").textContent =
        "카카오 지도 스크립트를 불러오지 못했습니다. JavaScript 키가 올바른지, 이 파일을 여는 도메인이 카카오 디벨로퍼스에 등록되어 있는지 확인해주세요.";
      document.getElementById("setupBanner").style.display = "block";
    };
    document.head.appendChild(script);
  }

</script>
