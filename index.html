<!doctype html>
<html lang="ko">
<head>
<script>try{if(sessionStorage.getItem('elium_auth_ok')!=='1'){location.replace('/maps/');}}catch(e){}</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>현장 3D 콘타모형</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
<style>
  :root{ --ink:#1c2433; --ink-soft:#5b6272; --panel:#fbfaf7; --line:#d4d0c6; --navy:#1b2f5c; --table:#d9d6cf; }
  html,body{margin:0;height:100%;background:var(--table);font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0}
  .panel{position:absolute;left:16px;top:16px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .panel h1{margin:0;font-size:18px;letter-spacing:-.3px}
  .panel p{margin:6px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
  .panel ul{list-style:none;margin:10px 0 0;padding:0}
  .panel li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px}
  .panel li:hover{background:#eef0f5}
  .panel li i{width:9px;height:9px;border-radius:50%;background:var(--navy);flex:none}
  .panel li.ref i{background:#9aa0ad}
  .panel li span{color:var(--ink-soft);font-size:12px;margin-left:auto}
  .island{cursor:pointer;display:flex;flex-direction:column;align-items:center}
  .island .in{display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;transition:transform .18s ease,opacity .3s ease}
  .island:hover .in{transform:scale(1.05)}
  .island img{width:var(--w,170px);height:auto;display:block;position:relative;z-index:1}
  .island .sh{display:block;width:calc(var(--w,170px)*.9);height:calc(var(--w,170px)*.16);margin-top:calc(var(--w,170px)*-.1);border-radius:50%;background:radial-gradient(closest-side,rgba(40,34,20,.32),rgba(40,34,20,0))}
  body.flying .island .in{opacity:0;pointer-events:none}
  body.flying .panel,body.flying .note{opacity:0;pointer-events:none}
  .panel,.note{transition:opacity .3s ease}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .6s ease;background:transparent}
  #frame.on{opacity:1;pointer-events:auto}
  #loader{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:10px;background:rgba(251,250,247,.94);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.1);opacity:0;pointer-events:none;transition:opacity .25s ease}
  #loader.on{opacity:1}
  #loader i{width:14px;height:14px;border-radius:50%;border:2px solid #cfd5e2;border-top-color:var(--navy);animation:spin .8s linear infinite}
  #loader a{color:var(--navy);pointer-events:auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cap{order:-1;position:relative;z-index:1;margin-bottom:4px;background:var(--navy);color:#fff;border-radius:8px;padding:5px 10px 6px;text-align:center;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .cap b{display:block;font-size:13.5px}
  .cap small{font-size:11px;color:#cdd6ea}
  .island.ref .cap{background:#fbfaf6;color:var(--ink);border:1px solid #cfc8b8}
  .island.ref .cap small{color:#6b665c}
  .note{position:absolute;right:14px;bottom:30px;z-index:5;font-size:11.5px;color:#6b665c;background:rgba(251,250,247,.85);padding:6px 10px;border-radius:8px;line-height:1.5;text-align:right}
  @media (max-width:640px){ .panel{max-width:none;right:16px} :root{--w:120px!important} .note{display:none} }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>현장 3D 콘타모형</h1>
  <p>섬을 누르면 해당 현장의 콘타모형(국토지리정보원 1:5,000 연속수치지형도)으로 들어갑니다.</p>
  <ul id="list"></ul>
</div>
<div class="note">섬 크기는 강조해서 표시 · 실제 범위 약 4~8 km</div>
<div id="loader" role="status"><i></i><span>모형 불러오는 중…</span></div>
<script>
// ===== 설정 =====
const SITES = [
  // site: 현장 위치(점), center/ext: 콘타모형 범위의 중심·한 변 길이(m) → 들어갈 때 지도를 모형과 같은 범위로 맞춤
  { id:'gy', name:'인천계양 A21', sub:'대방 엘리움 · 비교단지 20곳', own:true,  site:[126.75265,37.54733], center:[126.73148,37.54751], ext:7740, island:[124.75,36.85], img:'island_gy.png', href:'gy.html' },
  { id:'bs', name:'부산에코델타시티 2차', sub:'대방 엘리움(29BL) · 비교단지 14곳', own:true, site:[128.922713,35.146939], center:[128.90651,35.11901], ext:8080, island:[128.25,33.95], img:'island_bs.png', href:'bs.html' },
  { id:'il', name:'일광신도시', sub:'비교단지 10곳 (부산 참고)', own:false, site:[129.2240,35.2652], center:[129.21900,35.26550], ext:4620, island:[130.45,35.55], img:'island_il.png', href:'il.html' },
];
const KOREA = [[124.1,33.3],[131.0,38.7]];   // 한반도 남쪽 + 섬 3개가 다 들어오는 범위
const HOME_PITCH = 18;                       // 너무 눕지 않게(예전 46°)
const FLY_MS = 2300, FADE_MS = 600;
// =================

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const wide = () => innerWidth > 900;
function homeCam(){
  const pad = {top:70, bottom:50, left: wide()?330:24, right:40};
  const c = map.cameraForBounds(KOREA, {padding:pad, pitch:HOME_PITCH, bearing:0}) || {center:[127.6,36.0], zoom:6.2};
  return {center:c.center, zoom:c.zoom, pitch:HOME_PITCH, bearing:0, padding:{top:0,bottom:0,left:0,right:0}};
}
// 모형 첫 화면(위에서 내려다본 모습)과 같은 범위의 지도 카메라
function siteCam(s){
  const a = innerWidth/innerHeight, t = Math.tan(32*Math.PI/360);
  const h = Math.min(s.ext*1.15/(2*t*a), 10500), span = 2*t*a*h;         // 모형 쪽 topPose()와 같은 계산
  const lat = s.center[1]*Math.PI/180;
  const zoom = Math.log2(40075016.686*Math.cos(lat)*innerWidth/(512*span));
  return {center:s.center, zoom, pitch:0, bearing:0, padding:{top:0,bottom:0,right:0,left: wide()?300:0}};
}

// ===== 시작: 메인 사이트(map3d.js)에 있는 Mapbox 토큰을 읽어서 사용 =====
(async()=>{
try{
  const t=await (await fetch('../map3d.js',{headers:{Range:'bytes=0-4095'}})).text();
  const m=t.match(/accessToken\s*=\s*["'](pk\.[^"']+)["']/);
  if(!m) throw new Error('token');
  mapboxgl.accessToken=m[1];
}catch(e){ document.getElementById('loader').innerHTML='<span>지도를 불러오지 못했어요(토큰)</span>'; document.getElementById('loader').classList.add('on'); return; }
const map = window.map = new mapboxgl.Map({ container:'map', style:'mapbox://styles/mapbox/light-v11', center:[127.6,36.0], zoom:6.2, pitch:HOME_PITCH, bearing:0, antialias:true, attributionControl:true, language:'ko' });
map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}),'bottom-right');

map.on('style.load', () => {
  // 모형 톤으로 색 조정(베이지 땅 · 옅은 청회색 바다)
  const L = map.getStyle().layers;
  for (const l of L) {
    const id = l.id;
    if (l.type==='background') map.setPaintProperty(id,'background-color','#ece7dc');
    if (/^land|landcover|landuse|national-park/.test(id) && l.type==='fill') { try{ map.setPaintProperty(id,'fill-color','#e7e1d3'); map.setPaintProperty(id,'fill-opacity',0.5);}catch(e){} }
    if (/^water$/.test(id)) map.setPaintProperty(id,'fill-color','#d5dfe3');
    if (/road|bridge|tunnel|path|rail|aeroway|building|poi|transit|airport/.test(id)) map.setLayoutProperty(id,'visibility','none');
    if (l.type==='symbol' && !/country-label|state-label|settlement-major-label|continent/.test(id)) map.setLayoutProperty(id,'visibility','none');
    if (/admin-0-boundary$/.test(id)) { try{ map.setPaintProperty(id,'line-color','#b9b09c'); }catch(e){} }
  }
  // 3D 지형 + 음영
  map.addSource('dem',{type:'raster-dem',url:'mapbox://mapbox.mapbox-terrain-dem-v1',tileSize:512,maxzoom:14});
  map.setTerrain({source:'dem',exaggeration:1.8});
  map.addLayer({id:'shade',type:'hillshade',source:'dem',paint:{'hillshade-shadow-color':'#8d8068','hillshade-highlight-color':'#fbf8f1','hillshade-accent-color':'#a79a80','hillshade-exaggeration':0.55}}, L.find(l=>l.type==='symbol')?.id);
  map.setFog({color:'#e9e5dc','high-color':'#dcd8cf','horizon-blend':0.08,'space-color':'#d9d6cf','star-intensity':0});

  // 한반도 밖은 옅게 덮어서 한반도만 또렷하게
  map.addSource('mask',{type:'geojson',data:'korea_mask.geojson'});
  map.addLayer({id:'mask',type:'fill',source:'mask',paint:{'fill-color':'#dcd8cf','fill-opacity':0.78}});
  // 현장 점 + 섬 연결선
  map.addSource('links',{type:'geojson',data:{type:'FeatureCollection',features:SITES.map(s=>({type:'Feature',properties:{own:s.own},geometry:{type:'LineString',coordinates:[s.site,s.island]}}))}});
  map.addLayer({id:'links',type:'line',source:'links',paint:{'line-color':'#1b2f5c','line-width':1.6,'line-opacity':0.55,'line-dasharray':[2,1.5]}});
  map.addSource('sites',{type:'geojson',data:{type:'FeatureCollection',features:SITES.map(s=>({type:'Feature',properties:{own:s.own},geometry:{type:'Point',coordinates:s.site}}))}});
  map.addLayer({id:'site-halo',type:'circle',source:'sites',paint:{'circle-radius':9,'circle-color':'#1b2f5c','circle-opacity':0.18}});
  map.addLayer({id:'site-dot',type:'circle',source:'sites',paint:{'circle-radius':4,'circle-color':['case',['get','own'],'#1b2f5c','#8a8272'],'circle-stroke-color':'#fff','circle-stroke-width':1.5}});
});

// 섬 마커
const list = document.getElementById('list');
for (const s of SITES) {
  const el = document.createElement('div'); el.className='island'+(s.own?'':' ref');
  el.innerHTML = `<div class="in"><div class="cap"><b>${s.name}</b><small>${s.sub}</small></div><img src="${s.img}" alt="${s.name} 콘타모형 섬"><i class="sh"></i></div>`;
  el.addEventListener('click', ()=>enter(s));
  el.addEventListener('pointerenter', ()=>prefetch(s));
  new mapboxgl.Marker({element:el, anchor:'bottom'}).setLngLat(s.island).addTo(map);
  const li=document.createElement('li'); if(!s.own) li.className='ref';
  li.innerHTML=`<i></i>${s.name}<span>들어가기 →</span>`; li.onclick=()=>enter(s); li.onpointerenter=()=>prefetch(s); list.appendChild(li);
}
function sizeIslands(){ if(state!=='home') return; const z=map.getZoom(); const w=Math.round(Math.max(130,Math.min(300,130+(z-5)*80))); document.documentElement.style.setProperty('--w',w+'px'); }
map.on('zoomend',sizeIslands);

// ===== 들어가기 / 나오기 (한 페이지 안에서 지도 → 모형으로 이어지게) =====
let state='home', cur=null, frame=null, pushed=false;
const body=document.body, loader=document.getElementById('loader');
const sleep = ms => new Promise(r=>setTimeout(r, reduce?0:ms));
const moveDone = () => new Promise(r=>map.once('moveend', r));
const fetched = new Set();
function prefetch(s){           // 모형 데이터(수 MB)를 미리 받아 두기 — 날아가는 동안 다운로드
  if (fetched.has(s.id)) return; fetched.add(s.id);
  for (const f of [s.id+'_meta.json', s.id+'_data.bin', s.href]) fetch(f).catch(()=>fetched.delete(s.id));
}
function openFrame(s){
  return new Promise((resolve, reject)=>{
    frame=document.createElement('iframe'); frame.id='frame'; frame.title=s.name+' 콘타모형'; frame.src=s.href;
    document.body.appendChild(frame);
    const t0=performance.now();
    const tick=setInterval(()=>{
      let w=null; try{ w=frame && frame.contentWindow; }catch(e){}
      if (w && w.__ready){ clearInterval(tick); hookFrame(w); resolve(w); }
      else if (performance.now()-t0 > 45000){ clearInterval(tick); reject(new Error('timeout')); }
    }, 60);
  });
}
function hookFrame(w){
  const d=w.document;
  const back=d.getElementById('back3d');
  if (back){ back.hidden=false; back.addEventListener('click', e=>{ e.preventDefault(); requestExit(); }); }
  d.addEventListener('keydown', e=>{ if(e.key==='Escape') requestExit(); });
}
async function enter(s, opts={}){
  if (state!=='home') return;
  state='entering'; cur=s; prefetch(s);
  if (opts.push!==false){ history.pushState({site:s.id}, '', '#'+s.id); pushed=true; }
  body.classList.add('flying');
  const cam=siteCam(s);
  if (opts.jump || reduce) map.jumpTo(cam);
  else { map.flyTo({...cam, duration:FLY_MS, curve:1.3, easing:ease, essential:true}); await moveDone(); }
  const lt=setTimeout(()=>loader.classList.add('on'), 250);
  let w;
  try{ w=await openFrame(s); }
  catch(e){ clearTimeout(lt); loader.innerHTML='<span>모형을 불러오지 못했어요 · <a href="'+s.href+'">직접 열기</a></span>'; return; }
  clearTimeout(lt); loader.classList.remove('on');
  try{ w.__introStart && w.__introStart(); }catch(e){}
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  frame.classList.add('on');
  try{ w.__introPlay && w.__introPlay(); }catch(e){}
  await sleep(FADE_MS);
  state='model'; try{ w.focus(); }catch(e){}
}
function requestExit(){
  if (state!=='model') return;
  if (pushed){ pushed=false; history.back(); } else { history.replaceState(null,'',location.pathname+location.search); exit(); }
}
async function exit(){
  if (state!=='model') return;
  state='exiting';
  const w=frame.contentWindow;
  map.jumpTo(siteCam(cur));                         // 창 크기가 바뀌었어도 모형과 같은 범위로
  try{ if (w.__introOut) await w.__introOut(900); }catch(e){}
  frame.classList.remove('on');
  await sleep(FADE_MS);
  frame.remove(); frame=null;
  if (reduce) map.jumpTo(homeCam());
  else { map.flyTo({...homeCam(), duration:FLY_MS, curve:1.3, easing:ease, essential:true}); await moveDone(); }
  state='home'; cur=null; body.classList.remove('flying'); sizeIslands();
}
addEventListener('popstate', ()=>{
  const id=location.hash.slice(1), s=SITES.find(x=>x.id===id);
  if (state==='model' && !s) exit();
  else if (state==='home' && s){ pushed=false; enter(s, {push:false}); }
});

map.once('load', ()=>{
  const s=SITES.find(x=>x.id===location.hash.slice(1));
  if (s) enter(s, {push:false, jump:true});            // 주소에 #gy 등이 붙어 있으면 바로 모형으로
  else { map.jumpTo(homeCam()); sizeIslands(); }
});
})();
</script>
</body>
</html>
